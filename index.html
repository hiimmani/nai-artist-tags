<title>NAI 작태 모음</title>
<style>
/* ═══ 🌸 벚꽃 (기본) ═══════════════════ */
:root{
  --bg:#ffeef3;
  --card:#ffffff;
  --line:#ffd4e0;
  --line-soft:#ffe6ee;
  --text:#b0798c;
  --muted:#dda8bb;
  --rose:#ffb7cd;
  --rose-deep:#f08cb0;
  --rose-soft:#fff0f5;
  --rose-chip:#fff4f8;
  --grad:linear-gradient(160deg,#ffb3ca,#f286ac);
  --glow:240,140,180;
  --c-ovl:122,62,88;
  --c-ovl2:70,30,45;
  --c-title:#ea87ac;
  --c-sub:#f3a8c3;
  --c-name:#bd6b8a;
  --c-cardtag:#e8a6c0;
  --c-count:#d9739e;
  --c-tagtext:#dd7ea6;
  --c-soft:#dd8fae;
  --c-hint:#e6b0c4;
  --c-faint:#f0c2d3;
  --c-toast:#d2699a;
  --c-imgbg:#ffe4ed;
  --c-dropline:#ffc4d8;
  --c-dropbg:#fff8fb;
  --c-inputbg:#fffafc;
  --c-grip:#ffdbe6;
  --c-skel2:#ffdde8;
  --c-code:#ffe0ec;
  --shadow:0 2px 4px rgba(var(--glow),.08), 0 8px 20px rgba(var(--glow),.12);
  --shadow-lift:0 6px 14px rgba(var(--glow),.15), 0 18px 38px rgba(var(--glow),.20);
  --r:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* ═══ ☁️ 하늘 ═════════════════════════ */
:root[data-theme="sky"]{
  --bg:#e9f6ff;
  --line:#c9e8fb;
  --line-soft:#ddf1fe;
  --text:#6f96b0;
  --muted:#a6cadd;
  --rose:#8ed4f5;
  --rose-deep:#4badde;
  --rose-soft:#eff8ff;
  --rose-chip:#f5fbff;
  --grad:linear-gradient(160deg,#93d4f3,#4fabdd);
  --glow:110,180,225;
  --c-ovl:40,84,110;
  --c-ovl2:18,50,70;
  --c-title:#63b8e6;
  --c-sub:#8fcaea;
  --c-name:#52859f;
  --c-cardtag:#a0cfe8;
  --c-count:#3f96c4;
  --c-tagtext:#479ecb;
  --c-soft:#6cb2d8;
  --c-hint:#a3cee6;
  --c-faint:#bcdcf0;
  --c-toast:#3a8db8;
  --c-imgbg:#dff2fd;
  --c-dropline:#b3ddf5;
  --c-dropbg:#f7fcff;
  --c-inputbg:#fafdff;
  --c-grip:#d4edfb;
  --c-skel2:#d8eefc;
  --c-code:#daeffc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.55;overflow-wrap:anywhere;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ── 헤더 ───────────────────────────── */
header{padding:44px 0 10px;text-align:center}
@media (min-width:700px){header{padding:64px 0 14px}}
h1{margin:0;font-size:clamp(29px,7vw,46px);font-weight:750;letter-spacing:-.02em;color:var(--c-title)}
.sub{margin:10px 0 0;font-size:clamp(14px,3.6vw,18px);font-weight:600;color:var(--c-sub);white-space:pre-line}
#editHead{
  display:none;margin:16px auto 0;padding:8px 18px;border-radius:999px;
  background:var(--card);color:var(--rose-deep);font-size:13.5px;font-weight:700;box-shadow:var(--shadow);
}
#editHead.on{display:inline-block}
#themeBtn{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:45;
  width:42px;height:42px;border-radius:50%;background:var(--card);
  font-size:19px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow);
  transition:transform .16s;
}
#themeBtn:active{transform:scale(.9)}

/* ── 검색 ───────────────────────────── */
.bar{position:sticky;top:0;z-index:30;padding:16px 0 10px;margin-top:10px;background:var(--bg)}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:20px;width:20px;height:20px;stroke:var(--c-faint);fill:none;stroke-width:2.2;pointer-events:none}
#q{
  width:100%;padding:15px 46px 15px 50px;border:2px solid transparent;border-radius:999px;
  background:var(--card);box-shadow:var(--shadow);font-size:16px;font-weight:500;outline:none;
  transition:border-color .16s,box-shadow .16s;
}
#q::placeholder{color:var(--c-faint);font-weight:500}
#q:focus{border-color:var(--rose);box-shadow:var(--shadow-lift)}
#clearQ{position:absolute;right:10px;width:32px;height:32px;border-radius:50%;display:none;place-items:center;color:var(--muted);font-size:17px;line-height:1}
#clearQ.on{display:grid}

/* ── 장수 · 정렬 ────────────────────── */
.meta{display:flex;align-items:center;gap:9px;margin-top:14px;padding:0 2px;flex-wrap:wrap}
.count{
  display:inline-flex;align-items:center;gap:7px;padding:9px 17px;border-radius:999px;
  background:var(--card);color:var(--c-count);font-weight:800;font-size:14.5px;
  white-space:nowrap;box-shadow:var(--shadow);
}
.count b{font-variant-numeric:tabular-nums}
.count.clickable{cursor:pointer}
.count .x{font-size:13px;opacity:.6}
.meta .grow{flex:1}
#sort{
  border:0;background:var(--card);border-radius:999px;padding:9px 14px;
  font-size:14px;font-weight:600;color:var(--c-soft);box-shadow:var(--shadow);outline:none;
}

/* ── 태그 ───────────────────────────── */
.tags{display:none;gap:8px;margin-top:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tags::-webkit-scrollbar{display:none}
.tags.on{display:flex}
.tag{
  flex:none;padding:8px 15px;border-radius:999px;background:var(--card);
  color:var(--c-tagtext);font-size:13.5px;font-weight:700;white-space:nowrap;
  box-shadow:var(--shadow);transition:transform .14s,background .14s,color .14s;
}
.tag .n{opacity:.45;margin-left:5px;font-variant-numeric:tabular-nums}
.tag.sel{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(var(--glow),.38)}
.tag.sel .n{opacity:.8}
.tag:active{transform:scale(.95)}

/* ── 그리드 ─────────────────────────── */
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:16px 0 44px}
@media (min-width:700px){#grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;padding-bottom:60px}}
.card{
  content-visibility:auto;contain-intrinsic-size:auto 240px;
  background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s;
  display:flex;flex-direction:column;
}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}}
.card .thumb{position:relative;aspect-ratio:3/4;background:var(--c-imgbg);overflow:hidden;display:block;width:100%;padding:0;border-radius:0}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s ease}
.card .thumb img.ready{opacity:1}
.card .thumb:active{opacity:.85}
.cap{padding:9px 10px 11px}
@media (min-width:700px){.cap{padding:12px 14px 14px}}
.nm{
  display:flex;align-items:flex-start;gap:4px;width:100%;text-align:left;
  font-size:12.5px;font-weight:750;color:var(--c-name);line-height:1.35;
  padding:2px 4px;margin:-2px -4px;border-radius:9px;transition:background .14s;
}
@media (min-width:700px){.nm{font-size:14.5px}}
/* 이름이 한 줄이든 두 줄이든 카드 높이가 같도록 자리를 고정한다 */
.nm .t{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.nm .ci{flex:none;font-size:11px;opacity:.32;margin-top:1px}
@media (hover:hover){.nm:hover{background:var(--rose-chip)}.nm:hover .ci{opacity:.8}}
.nm:active{background:var(--rose-soft)}
.nm.copied{background:#e7f5ec;color:#3f8a5f}
.tg{
  margin-top:4px;font-size:11px;color:var(--c-cardtag);font-weight:650;min-height:1.5em;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
@media (min-width:700px){.tg{font-size:12.5px}}

.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:14px;opacity:.55}
.empty p{margin:6px 0;font-size:15px;font-weight:600}
.empty .hint{font-size:13.5px;color:var(--c-hint);font-weight:500}

/* ── 라이트박스 ─────────────────────── */
.lb{position:fixed;inset:0;z-index:100;display:none;background:rgba(var(--c-ovl),.7);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.lb.on{display:block}
.lb-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(60px + env(safe-area-inset-top,0px)) 62px calc(30px + var(--safe-b))}
@media (max-width:640px){.lb-scroll{padding-left:52px;padding-right:52px}}
.lb-inner{max-width:640px;margin:0 auto}
/* 그림 비율을 그대로 살린다. 위아래에 빈 칸이 생기지 않는다.
   불러오기 전에도 자리가 흔들리지 않도록 비율은 인라인으로 넣어 준다. */
.lb-img{
  width:100%;height:auto;display:block;
  background:var(--c-imgbg);border-radius:18px;
  box-shadow:0 20px 54px rgba(var(--c-ovl2),.42);margin-bottom:12px;
}
.lb-info{margin-top:6px;background:var(--card);border-radius:var(--r);padding:18px 18px 20px;box-shadow:0 12px 32px rgba(var(--c-ovl2),.22)}
#lbName{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  font-size:20px;font-weight:800;color:var(--c-title);line-height:1.35;
  padding:8px 12px;margin:-8px -12px;border-radius:14px;transition:background .14s;
}
#lbName .ci{flex:none;font-size:14px;opacity:.38;margin-top:4px}
@media (hover:hover){#lbName:hover{background:var(--rose-chip)}}
#lbName:active{background:var(--rose-soft)}
#lbName.copied{background:#e7f5ec;color:#3f8a5f}
.cphint{margin:9px 0 0;font-size:12px;color:var(--c-hint);font-weight:600}
.lb-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.lb-tags .t{padding:7px 14px;border-radius:999px;background:var(--rose-chip);color:var(--c-count);font-size:13px;font-weight:700}
.lb-tags .none{color:var(--c-faint);font-size:13px;padding:7px 0;font-weight:600}
.lb-actions{display:flex;gap:9px;margin-top:17px}
.lb-actions button{flex:1;padding:12px;border-radius:14px;font-size:14px;font-weight:750;background:var(--rose-chip);color:var(--c-count)}
.lb-actions .del{background:#fdecec;color:#c9636c}
.lb-top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:4;pointer-events:none}
.lb-top>*{pointer-events:auto}
.icob{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--c-count);font-size:20px;line-height:1;box-shadow:0 4px 14px rgba(var(--c-ovl2),.26)}
.lb-pos{padding:8px 15px;border-radius:999px;background:var(--card);color:var(--c-count);font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(var(--c-ovl2),.26)}
/* 좌우 넘김 화살표 — 폰에서도 보이게 */
.nav{
  position:fixed;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;background:var(--card);color:var(--c-count);
  display:grid;place-items:center;font-size:22px;line-height:1;
  box-shadow:0 4px 14px rgba(var(--c-ovl2),.3);z-index:3;
}
.nav.prev{left:8px}.nav.next{right:8px}
.nav:active{transform:translateY(-50%) scale(.9)}
.nav[disabled]{opacity:.3;pointer-events:none}

/* ── 추가 버튼 ──────────────────────── */
.fab{
  position:fixed;right:18px;bottom:calc(18px + var(--safe-b));z-index:40;
  width:60px;height:60px;border-radius:50%;background:var(--grad);color:#fff;
  font-size:30px;font-weight:300;line-height:1;display:none;place-items:center;
  box-shadow:0 8px 24px rgba(var(--glow),.5);
}
.fab.on{display:grid}
.fab:active{transform:scale(.93)}
.lockrow{padding:6px 0 44px;text-align:center}
#lockBtn{font-size:12.5px;color:var(--c-hint);padding:9px 16px;border-radius:999px;font-weight:600}

/* ── 시트 ───────────────────────────── */
.sheet{position:fixed;inset:0;z-index:120;display:none;background:rgba(var(--c-ovl),.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet.on{display:block}
.sheet-box{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;background:var(--card);
  border-radius:28px 28px 0 0;padding:8px 20px calc(22px + var(--safe-b));
  box-shadow:0 -10px 44px rgba(var(--c-ovl2),.3);animation:up .26s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:720px){
  .sheet-box{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:540px;border-radius:26px;max-height:88vh}
  @keyframes up{from{transform:translate(-50%,-46%);opacity:.4}to{transform:translate(-50%,-50%);opacity:1}}
}
.grip{width:42px;height:5px;border-radius:99px;background:var(--c-grip);margin:7px auto 16px}
@media (min-width:720px){.grip{display:none}}
.sheet h3{margin:2px 0 18px;font-size:19px;font-weight:800;color:var(--c-title)}

label.f{display:block;margin-bottom:15px}
label.f>span:first-child{display:block;font-size:13.5px;font-weight:750;color:var(--c-tagtext);margin-bottom:7px}
label.f input,label.f textarea{
  width:100%;padding:13px 15px;border:2px solid var(--line-soft);border-radius:14px;
  background:var(--c-inputbg);font-size:16px;outline:none;transition:border-color .16s;
}
label.f input:focus,label.f textarea:focus{border-color:var(--rose)}
label.f textarea{resize:vertical;min-height:82px;line-height:1.6;font-size:15.5px}
label.f .tip{font-size:12.5px;color:var(--c-hint);margin-top:6px;font-weight:500;display:block}

.taginput{display:flex;flex-wrap:wrap;align-items:center;gap:7px;border:2px solid var(--line-soft);border-radius:14px;background:var(--c-inputbg);padding:8px 10px;transition:border-color .16s}
.taginput.focus{border-color:var(--rose)}
.taginput .chip{display:inline-flex;align-items:center;gap:5px;padding:6px 8px 6px 13px;border-radius:999px;background:var(--rose-chip);color:var(--c-count);font-size:13.5px;font-weight:750}
.taginput .chip b{cursor:pointer;font-size:14px;opacity:.5;font-weight:800;padding:0 2px}
.taginput input{flex:1;min-width:90px;width:90px;border:0;outline:none;background:none;padding:6px 3px;font-size:16px}

.drop{
  border:2.5px dashed var(--c-dropline);border-radius:20px;background:var(--c-dropbg);
  padding:22px 14px;text-align:center;color:var(--muted);font-size:14px;font-weight:600;
  margin-bottom:14px;cursor:pointer;transition:background .16s,border-color .16s;
}
.drop:hover,.drop.over{background:var(--rose-soft);border-color:var(--rose)}
.drop .ic{font-size:30px;display:block;margin-bottom:8px;opacity:.75}
.drop .dim{color:var(--c-faint)}

/* 고른 사진 목록 (지우기 가능) */
.picks{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px}
.pick{position:relative;width:72px;height:96px;border-radius:13px;overflow:hidden;background:var(--c-imgbg);box-shadow:var(--shadow)}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick .rm{
  position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.94);color:#c9636c;font-size:13px;font-weight:800;
  display:grid;place-items:center;line-height:1;box-shadow:0 2px 6px rgba(var(--c-ovl2),.28);
}
.pick .no{position:absolute;left:4px;bottom:4px;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--c-count);font-size:10.5px;font-weight:800}

.cover-prev{width:124px;height:65px;object-fit:cover;border-radius:12px;flex:none;background:var(--c-imgbg)}
.one{display:flex;gap:14px;align-items:flex-start;margin-bottom:15px}
#hCoverZone{border:2px dashed transparent;border-radius:16px;padding:7px;margin:-7px -7px 9px}
#hCoverZone.over{border-color:var(--rose);background:var(--rose-soft)}
.one .fill{flex:1;min-width:0}

.btns{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:15px;border-radius:16px;font-size:15px;font-weight:800;background:var(--rose-soft);color:var(--c-soft)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 5px 16px rgba(var(--glow),.4)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.mini{flex:none;padding:11px 16px;font-size:13.5px;border-radius:13px}
.note{background:var(--rose-chip);border-radius:14px;padding:13px 15px;font-size:12.5px;color:var(--c-soft);line-height:1.7;margin-bottom:16px;font-weight:500}
.note b{color:var(--c-count)}
.note code{background:var(--c-code);padding:2px 6px;border-radius:6px;font-size:12px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:13px;border-radius:14px;background:var(--rose-soft);color:var(--c-soft);font-size:14.5px;font-weight:750;border:2px solid transparent}
.seg button.on{background:var(--card);border-color:var(--rose);color:var(--c-count)}

#prog{position:fixed;left:0;top:0;height:4px;width:0;z-index:200;background:var(--grad);transition:width .25s ease,opacity .3s}
#toast{
  position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%) translateY(12px);
  z-index:210;opacity:0;pointer-events:none;background:var(--c-toast);color:#fff;
  padding:13px 22px;border-radius:999px;font-size:14px;font-weight:700;
  box-shadow:0 10px 30px rgba(var(--c-ovl2),.36);transition:opacity .22s,transform .22s;
  max-width:calc(100vw - 32px);text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{background:linear-gradient(100deg,var(--rose-soft) 30%,var(--c-skel2) 50%,var(--rose-soft) 70%);background-size:220% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-220% 0}}
</style>
</head>
<body>

<div id="prog"></div>

<div class="wrap">
  <header>
    <h1 id="siteTitle">NAI 작태 모음</h1>
    <p class="sub" id="siteSub">V5 기준 계속 추가 됨</p>
    <button id="editHead">✎ 제목 수정</button>
  </header>

  <div class="bar" id="bar">
    <div class="search">

      <option value="new">최신순</option>

  <div class="lb-scroll" id="lbScroll">

        <button id="lbName"><span class="t"></span><span class="ci">⧉</span></button>

<div class="sheet" id="sheet"><div class="sheet-box" id="sheetBox"></div></div>
<div id="toast"></div>

<script>
/* =========================================================
   NAI 작태 모음 — 단일 파일 갤러리
   · 한 항목에 사진 여러 장 (imgs 배열)
   · 원본 파일을 그대로 올려 메타데이터(NAI 프롬프트)를 보존
   · 목록용 썸네일만 따로 작게 만들어 씀
   ========================================================= */
const $ = s => document.querySelector(s);
const CFG_KEY = 'nai_gallery_cfg_v1';
const THEME_KEY = 'nai_theme_v1';
const CHUNK = 60;
const THUMB = { max: 420,  q: .72 };
const FULL  = { max: 1600, q: .86 };
const PARALLEL = 4;                       // GitHub 업로드 동시 개수
const DEF = { title: 'NAI 작태 모음', sub: 'V5 기준 계속 추가 됨', theme: 'sakura', cover: '' };
const THEMES = { sakura: { icon: '🌸', bg: '#ffeef3', label: '벚꽃' },
                 sky:    { icon: '☁️', bg: '#e9f6ff', label: '하늘' } };

const S = {
  items: [], site: { ...DEF },
  view: [], drawn: 0, tag: null,
  mode: 'local', cfg: null, admin: false,
  cur: -1, urls: new Map()
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let toastT;
function toast(msg, ms = 2200){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function prog(p){
  const el = $('#prog');
  if(p === null){ el.style.opacity = 0; setTimeout(() => { el.style.width = 0; el.style.opacity = 1; }, 320); return; }
  el.style.width = Math.max(3, p * 100) + '%';
}
// 동시에 n개씩만 처리 (전부 한 번에 던지면 GitHub이 막는다)
async function mapLimit(arr, n, fn){
  const out = new Array(arr.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, arr.length) }, async () => {
    while(i < arr.length){ const k = i++; out[k] = await fn(arr[k], k); }
  }));
  return out;
}

/* ── 복사 ─────────────────────────────────────────────── */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch{}
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    return ok;
  }catch{ return false; }
}
async function copyFrom(el, text){
  if(!await copyText(text)) return toast('복사에 실패했습니다');
  toast('복사됨 · ' + text);
  el.classList.add('copied');
  setTimeout(() => el.classList.remove('copied'), 900);
}

/* ── 태그 ─────────────────────────────────────────────── */
function parseTags(str){
  return String(str || '').split(/[\s,]+/)
    .map(t => t.replace(/^#+/, '').trim()).filter(Boolean)
    .filter((t, i, a) => a.indexOf(t) === i).slice(0, 20);
}
const tagsOf = it => Array.isArray(it.tags) ? it.tags : [];
const imgsOf = it => Array.isArray(it.imgs) ? it.imgs : [];

/* ── IndexedDB ────────────────────────────────────────── */
let dbP;
function db(){
  return dbP ||= new Promise((res, rej) => {
    const r = indexedDB.open('nai_gallery', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
      if(!d.objectStoreNames.contains('meta'))  d.createObjectStore('meta');
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function idb(store, mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode);
    const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror    = () => rej(tx.error);
  });
}
const soft = (p, fb = null) => p.catch(() => fb);
const putBlob = (k, v) => idb('blobs', 'readwrite', s => s.put(v, k));
const getBlob = k      => soft(idb('blobs', 'readonly',  s => s.get(k)));
const delBlob = k      => soft(idb('blobs', 'readwrite', s => s.delete(k)));
const putMeta = ()     => idb('meta', 'readwrite', s => { s.put(S.items, 'items'); return s.put(S.site, 'site'); });
const getMeta = k      => soft(idb('meta', 'readonly', s => s.get(k)));

/* ── 크기 줄이기 (용량을 위해 WebP 로 다시 저장) ───────── */
async function variant(file, opt){
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { throw new Error('이미지를 읽을 수 없습니다'); }
  const ow = bmp.width, oh = bmp.height;
  const scale = Math.min(1, opt.max / Math.max(ow, oh));
  const w = Math.max(1, Math.round(ow * scale));
  const h = Math.max(1, Math.round(oh * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, 0, 0, w, h);
  bmp.close?.();
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', opt.q))
            || await new Promise(r => c.toBlob(r, 'image/jpeg', opt.q));
  return { blob, w, h, ow, oh };
}
// 링크 미리보기용 1200×630 (세로 사진은 윗부분이 더 보이게)
async function coverImage(file){
  const W = 1200, H = 630;
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { throw new Error('이미지를 읽을 수 없습니다'); }
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = THEMES[curTheme()].bg;   // 남는 여백은 지금 테마 배경색으로
  ctx.fillRect(0, 0, W, H);
  const s = Math.max(W / bmp.width, H / bmp.height);
  const dw = bmp.width * s, dh = bmp.height * s;
  ctx.drawImage(bmp, (W - dw) / 2, (H - dh) * .25, dw, dh);
  bmp.close?.();
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));
}
const b64 = blob => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload  = () => res(String(fr.result).split(',')[1]);
  fr.onerror = rej;
  fr.readAsDataURL(blob);
});

/* ── GitHub (Git Data API) ────────────────────────────── */
const api = p => `https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/${p}`;
const ghHead = () => ({
  Authorization: 'Bearer ' + S.cfg.token,
  Accept: 'application/vnd.github+json',
  'X-GitHub-Api-Version': '2022-11-28'
});
async function ghReq(method, path, body){
  const r = await fetch(api(path), {
    method, headers: ghHead(),
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store'
  });
  if(!r.ok){
    const txt = await r.text();
    if(r.status === 401) throw new Error('토큰이 올바르지 않습니다');
    if(r.status === 403) throw new Error('권한이 없습니다 (토큰의 Contents 권한 확인)');
    if(r.status === 404) throw new Error('저장소나 브랜치를 찾을 수 없습니다');
    const e = new Error(`GitHub 오류 ${r.status}: ` + txt.slice(0, 140));
    e.status = r.status; e.body = txt;
    throw e;
  }
  return r.status === 204 ? null : r.json();
}

// changes: [{path, blob|b64}] 추가·교체 / [{path, del:true}] 삭제 — 전부 한 커밋으로
async function ghCommit(changes, message, onProg){
  let done = 0;
  const tree = await mapLimit(changes, PARALLEL, async c => {   // 파일 업로드는 병렬로
    if(c.del) return { path: c.path, mode: '100644', type: 'blob', sha: null };
    const content = c.b64 ?? await b64(c.blob);
    const b = await ghReq('POST', 'git/blobs', { content, encoding: 'base64' });
    onProg && onProg(++done / changes.length);
    return { path: c.path, mode: '100644', type: 'blob', sha: b.sha };
  });
  let lastErr;
  for(let i = 0; i < 4; i++){
    try{
      const ref  = await ghReq('GET', `git/ref/heads/${S.cfg.branch}`);
      const head = ref.object.sha;
      const base = (await ghReq('GET', `git/commits/${head}`)).tree.sha;
      const nt = await ghReq('POST', 'git/trees', { base_tree: base, tree });
      const nc = await ghReq('POST', 'git/commits', { message, tree: nt.sha, parents: [head] });
      await ghReq('PATCH', `git/refs/heads/${S.cfg.branch}`, { sha: nc.sha });
      return;
    }catch(e){
      lastErr = e;
      if(e.status !== 409 && e.status !== 422) throw e;
      await sleep(700 * (i + 1));
    }
  }
  throw lastErr;
}

function utf8b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function dataB64(){
  return utf8b64(JSON.stringify({ version: 3, title: S.site.title, sub: S.site.sub,
    theme: S.site.theme, cover: S.site.cover || '', updated: new Date().toISOString(), items: S.items }, null, 1));
}
async function commitAll(changes, message, onProg){
  if(S.mode !== 'github') return putMeta();
  try{
    await ghCommit([...changes, { path: 'data.json', b64: dataB64() }], message, onProg);
  }catch(e){
    if(e.status === 422 && changes.some(c => c.del)){   // 지울 파일이 이미 없을 때
      await ghCommit([...changes.filter(c => !c.del), { path: 'data.json', b64: dataB64() }], message, onProg);
      return;
    }
    throw e;
  }
}

/* ── 링크 미리보기(og) 태그 자동 갱신 ────────────────── */
function siteBase(){ return location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, ''); }
const escAttr = s => String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
function setMeta(html, key, val){
  const attr = key.startsWith('og:') ? 'property' : 'name';
  const re = new RegExp(`(<meta\\s+${attr}="${key}"\\s+content=")[^"]*(")`, 'i');
  return html.replace(re, (m, a, b) => a + escAttr(val) + b);
}
async function ogChange(){
  if(S.mode !== 'github' || !S.cfg) return null;
  if(!/^https?:$/.test(location.protocol)) return null;   // 내 PC 파일로 열었을 땐 건드리지 않는다
  let html;
  try{
    const r = await fetch(api('contents/index.html?ref=' + S.cfg.branch),
      { headers: { ...ghHead(), Accept: 'application/vnd.github.raw' }, cache: 'no-store' });
    if(!r.ok) return null;
    html = await r.text();
  }catch{ return null; }

  const base = siteBase();
  const img  = base + 'cover.jpg' + (S.site.cover ? '?v=' + S.site.cover : '');
  const desc = S.site.sub.replace(/\s*\n+\s*/g, ' ').trim();   // 미리보기 설명은 한 줄로
  let out = html;
  out = setMeta(out, 'og:site_name',        S.site.title);
  out = setMeta(out, 'og:title',            S.site.title);
  out = setMeta(out, 'og:description',      desc);
  out = setMeta(out, 'twitter:title',       S.site.title);
  out = setMeta(out, 'twitter:description', desc);
  out = setMeta(out, 'og:url',              base);
  out = setMeta(out, 'og:image',            img);
  out = setMeta(out, 'twitter:image',       img);

  const ok = out !== html
    && /<\/html>/i.test(out) && /id="grid"/.test(out) && /<title>/i.test(out)
    && !new RegExp('content="__' + 'SITE__').test(out)   // 쪼개 둔다. 안 그러면 이 검사 코드 자체에 걸린다
    && Math.abs(out.length - html.length) < html.length * .1;
  return ok ? { path: 'index.html', b64: utf8b64(out) } : null;
}

/* ── 이미지 주소 ──────────────────────────────────────── */
async function srcOf(img, which){
  if(!img) return '';
  const key = img.k + (which === 'thumb' ? '_t' : '_f');
  if(S.urls.has(key)) return S.urls.get(key);      // 방금 올린 건 배포 전에도 바로 표시
  if(S.mode === 'github') return which === 'thumb' ? img.thumb : img.src;
  const b = await getBlob(key);
  if(!b) return '';
  const u = URL.createObjectURL(b);
  S.urls.set(key, u);
  return u;
}
function dropUrls(k){
  ['_t','_f'].forEach(s => { const u = S.urls.get(k + s); if(u) URL.revokeObjectURL(u); S.urls.delete(k + s); });
}

/* ── 사진 준비 (썸네일 생성 + 저장 대상 만들기) ───────── */
async function prepImages(files, changes){
  // 썸네일과 본 그림을 병렬로 만든다
  const pairs = await Promise.all([...files].map(async f =>
    ({ t: await variant(f, THUMB), g: await variant(f, FULL) })));
  const out = [];
  for(const { t, g } of pairs){
    const k = uid();
    const ext = b => b.type === 'image/webp' ? 'webp' : 'jpg';
    const rec = { k, w: g.w, h: g.h };
    if(S.mode === 'github'){
      rec.thumb = `thumbs/${k}.${ext(t.blob)}`;
      rec.src   = `images/${k}.${ext(g.blob)}`;
      changes.push({ path: rec.thumb, blob: t.blob }, { path: rec.src, blob: g.blob });
    }else{
      await putBlob(k + '_t', t.blob);
      await putBlob(k + '_f', g.blob);
    }
    S.urls.set(k + '_t', URL.createObjectURL(t.blob));
    S.urls.set(k + '_f', URL.createObjectURL(g.blob));
    out.push(rec);
  }
  return out;
}

/* ── 추가 / 수정 / 삭제 ───────────────────────────────── */
async function addItem(files, name, tags){
  const changes = [];
  try{
    prog(.05);
    const imgs = await prepImages(files, changes);
    prog(.2);
    const item = { id: uid(), name: (name || '').trim() || '이름 없음', tags: tags.slice(), imgs, ts: Date.now() };
    S.items.push(item);
    try{ await commitAll(changes, 'add item', p => prog(.2 + p * .75)); }
    catch(e){ S.items.pop(); throw e; }
    prog(1);
  } finally { prog(null); }
}

async function updateItem(id, name, tags, addFiles, removeKeys){
  const it = S.items.find(x => x.id === id);
  if(!it) return;
  const before = { name: it.name, tags: it.tags, imgs: it.imgs };
  const changes = [];
  try{
    prog(.05);
    let imgs = imgsOf(it).slice();
    if(removeKeys && removeKeys.length){
      imgs.filter(g => removeKeys.includes(g.k)).forEach(g => {
        if(S.mode === 'github'){
          if(g.thumb) changes.push({ path: g.thumb, del: true });
          if(g.src)   changes.push({ path: g.src,   del: true });
        }else{ delBlob(g.k + '_t'); delBlob(g.k + '_f'); }
        dropUrls(g.k);
      });
      imgs = imgs.filter(g => !removeKeys.includes(g.k));
    }
    if(addFiles && addFiles.length) imgs = imgs.concat(await prepImages(addFiles, changes));
    it.name = name; it.tags = tags; it.imgs = imgs;
    prog(.2);
    try{ await commitAll(changes, 'edit item', p => prog(.2 + p * .75)); }
    catch(e){ Object.assign(it, before); throw e; }
  } finally { prog(null); }
}

async function removeItem(id){
  const i = S.items.findIndex(x => x.id === id);
  if(i < 0) return;
  const it = S.items[i];
  S.items.splice(i, 1);
  const changes = [];
  if(S.mode === 'github')
    imgsOf(it).forEach(g => {
      if(g.thumb) changes.push({ path: g.thumb, del: true });
      if(g.src)   changes.push({ path: g.src,   del: true });
    });
  try{ await commitAll(changes, 'delete item'); }
  catch(e){ S.items.splice(i, 0, it); throw e; }
  imgsOf(it).forEach(g => { if(S.mode !== 'github'){ delBlob(g.k + '_t'); delBlob(g.k + '_f'); } dropUrls(g.k); });
}

/* ── 테마 ─────────────────────────────────────────────── */
function resolveTheme(){
  let v = null;
  try{ v = localStorage.getItem(THEME_KEY); }catch{}
  if(THEMES[v]) return v;
  return THEMES[S.site.theme] ? S.site.theme : 'sakura';
}
function curTheme(){ return document.documentElement.getAttribute('data-theme') === 'sky' ? 'sky' : 'sakura'; }
function applyTheme(t){
  if(!THEMES[t]) t = 'sakura';
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', THEMES[t].bg);
  $('#themeBtn').textContent = THEMES[t].icon;
  // 이미 그려 둔 곳의 아이콘도 같이 바꾼다 (안 그러면 하늘색인데 벚꽃이 남는다)
  document.querySelectorAll('.big.themed').forEach(e => e.textContent = THEMES[t].icon);
  const ic = $('#drop') && $('#drop').querySelector('.ic');
  if(ic) ic.textContent = picked.length ? '✅' : THEMES[t].icon;
}
$('#themeBtn').onclick = () => {
  const t = curTheme() === 'sky' ? 'sakura' : 'sky';   // 저장이 막힌 브라우저에서도 왔다 갔다 되게
  try{ localStorage.setItem(THEME_KEY, t); }catch{}
  applyTheme(t);
  toast(THEMES[t].label + '색으로 바꿨어요', 1500);
};

/* ── 헤더 ─────────────────────────────────────────────── */
function paintHead(){
  $('#siteTitle').textContent = S.site.title;
  $('#siteSub').textContent   = S.site.sub;
  $('#siteSub').style.display = S.site.sub ? '' : 'none';
  document.title = S.site.title;
}

/* ── 렌더 ─────────────────────────────────────────────── */
const grid = $('#grid');
let io, ioMore;

function applyFilter(){
  const q = $('#q').value.trim().toLowerCase();
  let v = S.items;
  if(S.tag) v = v.filter(it => tagsOf(it).includes(S.tag));
  if(q) v = v.filter(it => (it.name || '').toLowerCase().includes(q) || tagsOf(it).some(t => t.toLowerCase().includes(q)));
  v = v.slice();
  const s = $('#sort').value;
  if(s === 'new')      v.sort((a, b) => b.ts - a.ts);
  else if(s === 'old') v.sort((a, b) => a.ts - b.ts);
  else                 v.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));
  S.view = v; S.drawn = 0;
  grid.innerHTML = '';
  drawMore(); paintCount(q); paintTags();
}
function paintCount(q){
  const el = $('#count'), total = S.items.length.toLocaleString('ko-KR');
  el.classList.toggle('clickable', !!S.tag);
  if(S.tag)  el.innerHTML = `#${esc(S.tag)} <b>${S.view.length}</b>개 <span class="x">✕</span>`;
  else if(q) el.innerHTML = `검색 <b>${S.view.length}</b>개 · 전체 ${total}개`;
  else       el.innerHTML = `총 <b>${total}</b>개`;
}
function paintTags(){
  const bar = $('#tagbar'), cnt = new Map();
  S.items.forEach(it => tagsOf(it).forEach(t => cnt.set(t, (cnt.get(t) || 0) + 1)));
  if(!cnt.size){ bar.classList.remove('on'); bar.innerHTML = ''; return; }
  const list = [...cnt.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ko'));
  bar.classList.add('on');
  bar.innerHTML = `<button class="tag${S.tag ? '' : ' sel'}" data-t="">전체<span class="n">${S.items.length}</span></button>` +
    list.map(([t, n]) => `<button class="tag${S.tag === t ? ' sel' : ''}" data-t="${esc(t)}">#${esc(t)}<span class="n">${n}</span></button>`).join('');
}
function drawMore(){
  if(S.drawn >= S.view.length){ if(!S.view.length) grid.innerHTML = emptyHTML(); return; }
  const frag = document.createDocumentFragment();
  const end = Math.min(S.drawn + CHUNK, S.view.length);
  for(let i = S.drawn; i < end; i++) frag.appendChild(card(S.view[i], i));
  grid.appendChild(frag);
  S.drawn = end;
  ioMore?.disconnect();
  if(S.drawn < S.view.length){
    const last = grid.children[Math.max(0, grid.children.length - 12)];
    ioMore = new IntersectionObserver(e => { if(e[0].isIntersecting) drawMore(); }, { rootMargin: '600px' });
    if(last) ioMore.observe(last);
  }
}
function emptyHTML(){
  const q = $('#q').value.trim();
  if(S.tag) return `<div class="empty"><div class="big">🏷️</div><p>#${esc(S.tag)} 에 해당하는 게 없어요</p></div>`;
  if(q)     return `<div class="empty"><div class="big">🔍</div><p>“${esc(q)}” 검색 결과가 없어요</p></div>`;
  return `<div class="empty"><div class="big themed">${THEMES[curTheme()].icon}</div><p>아직 이미지가 없어요</p>
    <p class="hint">${S.admin ? '오른쪽 아래 ＋ 로 추가하세요' : '아래 🔒 관리에서 로그인하면 추가할 수 있어요'}</p></div>`;
}
function card(it, idx){
  const d = document.createElement('div');
  d.className = 'card';
  d.dataset.i = idx;
  const tg = tagsOf(it);
  d.innerHTML =
    `<button class="thumb skel" aria-label="크게 보기"><img alt="" loading="lazy" decoding="async"></button>
     <div class="cap">
       <button class="nm"><span class="t">${esc(it.name)}</span><span class="ci">⧉</span></button>
       <div class="tg">${tg.map(t => '#' + esc(t)).join(' ')}</div>
     </div>`;
  const img = d.querySelector('img');
  io ||= new IntersectionObserver((es, ob) => {
    es.forEach(async e => {
      if(!e.isIntersecting) return;
      ob.unobserve(e.target);
      const el = e.target;
      const item = S.items.find(x => x.id === el.dataset.id);
      const src = await srcOf(imgsOf(item || {})[0], 'thumb');
      if(!src) { el.parentElement.classList.remove('skel'); return; }
      el.onload  = () => { el.classList.add('ready'); el.parentElement.classList.remove('skel'); };
      el.onerror = () => el.parentElement.classList.remove('skel');
      el.src = src;
    });
  }, { rootMargin: '400px' });
  img.dataset.id = it.id;
  io.observe(img);
  return d;
}
grid.addEventListener('click', e => {
  const c = e.target.closest('.card'); if(!c) return;

async function openLB(i){
  if(i < 0 || i >= S.view.length) return;
  S.cur = i;
  const it = S.view[i], im = imgsOf(it);
  $('#lbName').querySelector('.t').textContent = it.name;
  $('#lbName').classList.remove('copied');
  const tg = tagsOf(it);
  $('#lbTags').innerHTML = tg.length
    ? tg.map(t => `<button class="t" data-t="${esc(t)}">#${esc(t)}</button>`).join('')
    : '<span class="none">태그 없음</span>';
  $('#lbPos').textContent = `${i + 1} / ${S.view.length}`;
  $('#lbActions').style.display = S.admin ? 'flex' : 'none';
  $('#lbPrev').disabled = i === 0;
  $('#lbNext').disabled = i === S.view.length - 1;

  // 사진이 여러 장이면 아래로 이어서 보여준다
  const box = $('#lbImgs');
  box.innerHTML = im.map(g =>
    `<img class="lb-img" alt=""${g.w && g.h ? ` style="aspect-ratio:${g.w}/${g.h}"` : ''}>`).join('');
  const els = [...box.querySelectorAll('img')];
  im.forEach(async (g, n) => {
    const src = await srcOf(g, 'full') || await srcOf(g, 'thumb');
    if(els[n]) els[n].src = src;
  });

  $('#lb').classList.add('on');
  $('#lbScroll').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeLB(){ $('#lb').classList.remove('on'); document.body.style.overflow = ''; S.cur = -1; }
$('#lbClose').onclick = closeLB;
$('#lb').addEventListener('click', e => { if(e.target.id === 'lb' || e.target.id === 'lbScroll') closeLB(); });
$('#lbPrev').onclick = () => openLB(S.cur - 1);
$('#lbNext').onclick = () => openLB(S.cur + 1);
$('#lbName').onclick = () => { const it = S.view[S.cur]; if(it) copyFrom($('#lbName'), it.name); };
$('#lbTags').addEventListener('click', e => {
  const b = e.target.closest('.t'); if(!b) return;
  closeLB(); $('#q').value = ''; $('#clearQ').classList.remove('on');
  selectTag(b.dataset.t);
});
document.addEventListener('keydown', e => {
  if(!$('#lb').classList.contains('on')) return;
  if(e.key === 'Escape') closeLB();
  if(e.key === 'ArrowLeft') openLB(S.cur - 1);
  if(e.key === 'ArrowRight') openLB(S.cur + 1);
});
let tx = 0, ty = 0;
$('#lbScroll').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('#lbScroll').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) openLB(S.cur + (dx < 0 ? 1 : -1));
}, { passive: true });

let sheetUrls = [];
function sheet(html){

/* 태그 입력 */
function tagField(id, initial){
  return `<label class="f"><span>태그</span>
    <div class="taginput" id="${id}Wrap">
      <input id="${id}" placeholder="" autocomplete="off" enterkeyhint="done" data-init="${esc((initial || []).join(' '))}">
    </div>
    <span class="tip">띄어쓰기 또는 엔터를 누르면 <b>#태그</b>로 만들어집니다</span>
  </label>`;
}
function initTagField(id){
  const wrap = $('#' + id + 'Wrap'), input = $('#' + id);
  let tags = parseTags(input.dataset.init);
  const paint = () => {
    [...wrap.querySelectorAll('.chip')].forEach(c => c.remove());
    tags.forEach((t, i) => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.innerHTML = `#${esc(t)}<b data-i="${i}">✕</b>`;
      wrap.insertBefore(c, input);
    });
  };
  const commit = () => {
    const add = parseTags(input.value);
    if(add.length){ tags = parseTags(tags.concat(add).join(' ')); input.value = ''; paint(); }
  };
  input.addEventListener('keydown', e => {
    if(e.isComposing || e.keyCode === 229) return;      // 한글 조합 중이면 IME 에 맡긴다
    if(e.key === 'Enter' || e.key === ',' || e.key === ' '){ e.preventDefault(); commit(); }
    else if(e.key === 'Backspace' && !input.value && tags.length){ tags.pop(); paint(); }
  });
  input.addEventListener('input', e => { if(!e.isComposing && /[\s,]/.test(input.value)) commit(); });
  input.addEventListener('compositionend', () => { if(/[\s,]/.test(input.value)) commit(); });
  input.addEventListener('focus', () => wrap.classList.add('focus'));
  input.addEventListener('blur',  () => { wrap.classList.remove('focus'); commit(); });
  wrap.addEventListener('click', e => {
    const x = e.target.closest('b[data-i]');
    if(x){ tags.splice(+x.dataset.i, 1); paint(); } else input.focus();
  });
  paint();
  return { get(){ commit(); return tags.slice(); } };
}

/* ── 이미지 추가 (여러 장 = 한 항목) ──────────────────── */
let picked = [];
function addSheet(){
  picked = [];
  sheet(`
    <h3>이미지 추가</h3>
    <div class="drop" id="drop"><span class="ic">${THEMES[curTheme()].icon}</span>탭해서 사진 선택 <span class="dim">(여러 장 가능)</span></div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <div class="picks" id="picks"></div>
    <label class="f"><span>이름</span><input id="fName" autocomplete="off"></label>
    ${tagField('fTags', S.tag ? [S.tag] : [])}
    <div class="btns">
      <button class="btn" id="cancel">취소</button>
      <button class="btn pri" id="save" disabled>저장</button>
    </div>`);

  const tf = initTagField('fTags');
  const fi = $('#file'), dp = $('#drop');
  dp.onclick = () => fi.click();
  dp.ondragover = e => { e.preventDefault(); dp.classList.add('over'); };
  dp.ondragleave = () => dp.classList.remove('over');
  dp.ondrop = e => { e.preventDefault(); dp.classList.remove('over'); take(e.dataTransfer.files); };
  fi.onchange = () => { take(fi.files); fi.value = ''; };   // 같은 파일을 또 고를 수 있게 비운다
  $('#cancel').onclick = closeSheet;

  function take(fl){
    // 바꾸는 게 아니라 뒤에 이어 붙인다
    picked = picked.concat([...fl].filter(f => f.type.startsWith('image/')));
    paintPicks();
  }
  function paintPicks(){
    $('#picks').innerHTML = picked.map((f, i) =>
      `<div class="pick"><img src="${previewURL(f)}" alt=""><span class="no">${i + 1}</span><button class="rm" data-i="${i}" aria-label="빼기">✕</button></div>`
    ).join('');
    dp.innerHTML = picked.length
      ? `<span class="ic">✅</span>${picked.length}장 선택됨 <span class="dim">· 탭하면 더 추가</span>`
      : `<span class="ic">${THEMES[curTheme()].icon}</span>탭해서 사진 선택 <span class="dim">(여러 장 가능)</span>`;
    $('#save').disabled = !picked.length;
  }
  $('#picks').addEventListener('click', e => {
    const b = e.target.closest('.rm'); if(!b) return;
    picked.splice(+b.dataset.i, 1); paintPicks();
  });

  $('#save').onclick = async () => {
    const btn = $('#save'), n = picked.length;
    btn.disabled = true; btn.textContent = '저장 중…';
    try{
      await addItem(picked, $('#fName').value, tf.get());
      closeSheet(); applyFilter(); toast(`사진 ${n}장으로 추가했습니다`);
    }catch(err){
      btn.disabled = false; btn.textContent = '저장';
      toast('실패: ' + err.message, 4500);
    }
  };
}

/* ── 수정 ─────────────────────────────────────────────── */
function editSheet(it){
  let addFiles = [], removeKeys = [];
  sheet(`
    <h3>수정</h3>
    <div class="picks" id="ePicks"></div>
    <button class="btn mini" type="button" id="eAdd" style="margin-bottom:15px">🖼️ 사진 추가</button>
    <input type="file" id="eFile" accept="image/*" multiple hidden>
    <label class="f"><span>이름</span><input id="eName" autocomplete="off"></label>
    ${tagField('eTags', tagsOf(it))}
    <div class="btns">
      <button class="btn" id="cancel">취소</button>
      <button class="btn pri" id="save">저장</button>
    </div>`);
  const tf = initTagField('eTags');
  $('#eName').value = it.name;

  async function paintE(){
    const keep = imgsOf(it).filter(g => !removeKeys.includes(g.k));
    const srcs = await Promise.all(keep.map(g => srcOf(g, 'thumb')));
    const box = $('#ePicks'); if(!box) return;                 // 그 사이 창을 닫았을 수 있다
    box.innerHTML =
      keep.map((g, i) => `<div class="pick"><img src="${srcs[i]}" alt=""><span class="no">${i + 1}</span><button class="rm" data-k="${esc(g.k)}" aria-label="빼기">✕</button></div>`).join('') +
      addFiles.map((f, i) => `<div class="pick"><img src="${previewURL(f)}" alt=""><span class="no">새</span><button class="rm" data-n="${i}" aria-label="빼기">✕</button></div>`).join('');
  }
  paintE();
  $('#eAdd').onclick = () => $('#eFile').click();
  $('#eFile').onchange = e => {
    addFiles = addFiles.concat([...e.target.files].filter(f => f.type.startsWith('image/')));
    e.target.value = ''; paintE();
  };
  $('#ePicks').addEventListener('click', e => {
    const b = e.target.closest('.rm'); if(!b) return;
    if(b.dataset.k !== undefined) removeKeys.push(b.dataset.k);
    else addFiles.splice(+b.dataset.n, 1);
    paintE();
  });
  $('#cancel').onclick = closeSheet;
  $('#save').onclick = async () => {
    const b = $('#save');
    if(imgsOf(it).filter(g => !removeKeys.includes(g.k)).length + addFiles.length === 0)
      return toast('사진이 최소 한 장은 있어야 합니다');
    b.disabled = true; b.textContent = '저장 중…';
    try{
      await updateItem(it.id, $('#eName').value.trim() || '이름 없음', tf.get(), addFiles, removeKeys);
      closeSheet(); applyFilter();
      const i = S.view.findIndex(x => x.id === it.id);
      if(i >= 0) openLB(i); else closeLB();
      toast('수정했습니다');
    }catch(err){ b.disabled = false; b.textContent = '저장'; toast('실패: ' + err.message, 4500); }
  };
}
$('#lbEdit').onclick = () => { const it = S.view[S.cur]; if(it) editSheet(it); };
$('#lbDel').onclick = async () => {
  const it = S.view[S.cur]; if(!it) return;

  try{ await removeItem(it.id); closeLB(); applyFilter(); toast('삭제했습니다'); }

};

function headSheet(){
  sheet(`

    <label class="f"><span>제목</span><input id="hT" autocomplete="off"></label>
    <label class="f"><span>소제목</span><textarea id="hS" rows="2"></textarea>

      <div class="seg" id="hTheme">
        <button type="button" data-v="sakura">🌸 벚꽃</button>

      </div>
      <span class="tip">사이트를 처음 열었을 때 보이는 색입니다. 방문자는 누구나 오른쪽 위 버튼으로 자기 화면 색을 바꿀 수 있어요.</span>
    </label>

      <div class="one" id="hCoverZone">
        <img class="cover-prev" id="hCover" alt="">
        <div class="fill">
          <button class="btn mini" type="button" id="hCoverPick">🖼️ 이미지 선택</button>
          <div class="tip" id="hCoverNote" style="margin-top:7px">SNS에 링크를 붙였을 때 뜨는 그림<br>PC에서는 그림을 끌어다 놓아도 됩니다</div>
        </div>
      </div>
      <input type="file" id="hCoverFile" accept="image/*" hidden>
    </label>
    <div class="btns">
      <button class="btn" id="cancel">취소</button>
      <button class="btn pri" id="save">저장</button>
    </div>`);
  $('#hT').value = S.site.title; $('#hS').value = S.site.sub;

  let pickTheme = THEMES[S.site.theme] ? S.site.theme : 'sakura';
  const paintSeg = () => document.querySelectorAll('#hTheme button')
    .forEach(b => b.classList.toggle('on', b.dataset.v === pickTheme));
  $('#hTheme').addEventListener('click', e => {
    const b = e.target.closest('button[data-v]'); if(!b) return;
    pickTheme = b.dataset.v; paintSeg();
    try{ localStorage.setItem(THEME_KEY, pickTheme); }catch{}
    applyTheme(pickTheme);
  });
  paintSeg();

  let coverFile = null;
  const cov = $('#hCover'), zone = $('#hCoverZone');
  cov.onerror = () => { cov.style.visibility = 'hidden'; };
  cov.src = 'cover.jpg?_=' + Date.now();
  const setCover = f => {
    if(!f || !f.type.startsWith('image/')) return;
    coverFile = f;
    cov.style.visibility = ''; cov.src = previewURL(f);
    $('#hCoverNote').textContent = '저장하면 이 그림으로 바뀝니다';
  };
  $('#hCoverPick').onclick = () => $('#hCoverFile').click();

  zone.ondragover  = e => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('over'); setCover(e.dataTransfer.files[0]); };

  $('#cancel').onclick = closeSheet;
  $('#save').onclick = async () => {
    const b = $('#save'); b.disabled = true; b.textContent = '저장 중…';
    const prev = { ...S.site };
    S.site = { title: $('#hT').value.trim() || DEF.title, sub: $('#hS').value.trim(),
               theme: pickTheme, cover: coverFile ? Date.now().toString(36) : (prev.cover || '') };
    try{
      const changes = [];
      if(coverFile && S.mode === 'github')
        changes.push({ path: 'cover.jpg', blob: await coverImage(coverFile) });
      if(prev.title !== S.site.title || prev.sub !== S.site.sub || coverFile){
        const og = await ogChange();
        if(og) changes.push(og);
      }
      await commitAll(changes, 'edit: site settings');
      paintHead(); closeSheet();
      toast(coverFile ? '저장했습니다 · 링크 미리보기 반영에 1~2분' : '저장했습니다', 3000);
    }
    catch(err){ S.site = prev; paintHead(); applyTheme(resolveTheme()); b.disabled = false; b.textContent = '저장'; toast('실패: ' + err.message, 4500); }
  };
}

  $('#out') && ($('#out').onclick = () => { try{ localStorage.removeItem(CFG_KEY); }catch{} closeSheet(); location.reload(); });

  $('#save').onclick = async () => {
    const b = $('#save'); b.disabled = true; b.textContent = '확인 중…';
    const cfg = {
      owner: $('#cOwner').value.trim(), repo: $('#cRepo').value.trim(),
      branch: $('#cBranch').value.trim() || 'main', token: $('#cToken').value.trim()
    };
    if(!cfg.owner || !cfg.repo || !cfg.token){ b.disabled = false; b.textContent = '확인'; return toast('빈 칸을 채워주세요'); }
    const prev = S.cfg, prevMode = S.mode;
    S.cfg = cfg;
    try{
      await ghReq('GET', `git/ref/heads/${cfg.branch}`);
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      S.admin = true;
      if(S.mode !== 'github'){ S.mode = 'github'; await commitAll([], 'init data.json'); }
      setAdminUI(); closeSheet(); applyFilter(); toast('관리자 모드 켜짐');
    }catch(err){
      S.cfg = prev; S.mode = prevMode;
      b.disabled = false; b.textContent = '확인';
      toast(err.message, 4000);
    }
  };
}
function setAdminUI(){
  $('#fab').classList.toggle('on', S.admin);
  $('#editHead').classList.toggle('on', S.admin);
  $('#lockBtn').textContent = S.admin ? '🔓 관리자 모드' : '🔒 관리';
}
$('#lockBtn').onclick = adminSheet;
$('#fab').onclick = addSheet;

/* ── 검색 / 정렬 ──────────────────────────────────────── */
let qT;
$('#q').addEventListener('input', () => {
  $('#clearQ').classList.toggle('on', !!$('#q').value);
  clearTimeout(qT); qT = setTimeout(applyFilter, 130);
});
$('#clearQ').onclick = () => { $('#q').value = ''; $('#clearQ').classList.remove('on'); applyFilter(); $('#q').focus(); };
$('#sort').addEventListener('change', applyFilter);
$('#q').addEventListener('keydown', e => { if(e.key === 'Enter') e.target.blur(); });

/* ── 시작 ─────────────────────────────────────────────── */
// 예전 형식(항목 하나에 사진 한 장) → imgs 배열로 자동 변환
function normalize(items){
  return (items || []).map(it => {
    if(!Array.isArray(it.tags)) it.tags = it.desc ? parseTags(it.desc) : [];
    delete it.desc;
    if(!Array.isArray(it.imgs)){
      it.imgs = (it.src || it.thumb)
        ? [{ k: it.id, src: it.src, thumb: it.thumb, w: it.w, h: it.h }] : [];
      delete it.src; delete it.thumb; delete it.w; delete it.h;
    }
    return it;
  });
}
(async function init(){
  try{ await boot(); }
  catch(err){ console.error(err); paintHead(); applyTheme(resolveTheme()); setAdminUI(); applyFilter(); toast('불러오는 중 문제가 발생했습니다', 4000); }
})();

async function boot(){
  try{ S.cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); }catch{}
  let remote = null;
  try{
    const r = await fetch('data.json?_=' + Date.now(), { cache: 'no-store' });
    if(r.ok) remote = await r.json();
  }catch{}

  if(remote && Array.isArray(remote.items)){
    S.mode  = 'github';
    S.items = normalize(remote.items);
    S.site  = { title: remote.title || DEF.title, sub: remote.sub ?? DEF.sub,
                theme: remote.theme || DEF.theme, cover: remote.cover || '' };
    S.admin = !!(S.cfg && S.cfg.token);
  }else{
    S.mode  = 'local';
    S.items = normalize(await getMeta('items'));
    S.site  = { ...DEF, ...((await getMeta('site')) || {}) };
    S.admin = true;                                  // 내 PC 파일로 열었을 때
  }
  paintHead(); applyTheme(resolveTheme()); setAdminUI(); applyFilter();

  // index.html 을 새로 올린 직후라면 링크 미리보기 주소를 한 번만 자동으로 채운다
  const og = document.querySelector('meta[property="og:url"]');
  if(S.admin && S.mode === 'github' && og && og.content.includes('__SITE__')){
    try{
      const ch = await ogChange();
      if(ch){ await commitAll([ch], 'set link preview'); toast('링크 미리보기를 설정했습니다', 3000); }
    }catch(e){ console.warn('og 자동설정 실패', e); }
  }
}
</script>
