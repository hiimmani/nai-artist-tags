  S.queueLoading = true;
  try{ importJobs = await restoreImport(); }
  catch{ toast('기기 저장소를 읽지 못했습니다'); return; }
  finally{ S.queueLoading = false; }
  picked = []; importStop = false;
  sheet(`
    <h3>이미지 일괄 추가 · ${CATS[addCat()]} 탭</h3>
    <div class="note">1,000장도 한 번에 선택할 수 있어요. 이미 등록된 작가명은 중복으로 제외합니다. 저장 중 중단되면 같은 브라우저에서 ＋를 눌러 이어 올리세요.</div>
    <div class="drop" id="drop" role="button" tabindex="0"><span class="ic">＋</span>사진 여러 장 선택</div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <p id="importStatus" role="status" aria-live="polite">사진을 선택하세요</p>
    <progress id="importProgress" value="0" max="1" style="width:100%;accent-color:var(--rose-deep)" aria-label="저장 진행률"></progress>
    <div id="importList" style="max-height:220px;overflow:auto;margin:12px 0;font-size:13px"></div>
    <p class="tip" id="importHint" style="font-size:12px">저장하는 동안 이 화면을 열어 두세요. 중단하면 현재 묶음까지 저장합니다.</p>
    <div class="btns">
      <button class="btn" id="cancel">닫기</button>
      <button class="btn pri" id="save" disabled>일괄 저장</button>
    </div>`);
  const fi = $('#file'), dp = $('#drop');
  const choose = () => { if(!S.importing) fi.click(); };
  dp.onclick = choose;
  dp.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); choose(); } };
  dp.ondragover = e => { e.preventDefault(); if(!S.importing) dp.classList.add('over'); };
  dp.ondragleave = () => dp.classList.remove('over');
  dp.ondrop = e => { e.preventDefault(); dp.classList.remove('over'); if(!S.importing) take(e.dataTransfer.files); };
  fi.onchange = () => { if(!S.importing) take(fi.files); fi.value = ''; };
  function take(files){
    let skipped = 0;
    const stamps = new Set(importJobs.map(j => j.stamp));
    const base = Date.now();
    for(const file of files){
      if(!file.type.startsWith('image/')){ skipped++; continue; }
      const stamp = JSON.stringify([file.name, file.size, file.lastModified]);
      if(stamps.has(stamp)){
        const old = importJobs.find(j => j.stamp === stamp);
        if(old && !old.saved && !old.staged){old.file=file;old.error='';old.state='대기';}
        else skipped++;
        continue;
      }
      stamps.add(stamp);
      importJobs.push({ id: uid(), file, label: file.name, stamp, cat: addCat(),
        ts: base + importJobs.length, state: '대기', saved: false });
    }
    // 고해상도 원본 미리보기를 수백 개 띄우지 않는다.
    paint();
    if(skipped) toast('중복 또는 이미지가 아닌 파일 ' + skipped + '개 제외');
  }
  function paint(){
    const total = importJobs.length, done = importJobs.filter(importFinished).length;
    const saved = importJobs.filter(j => j.saved).length, duplicates = importJobs.filter(j => j.skipped).length;
    const errors = importJobs.filter(j => j.error);
    $('#importStatus').textContent = total
      ? (S.importing ? '저장 중 · ' : done === total ? '처리 완료 · ' : '선택 ' + total + '장 · ') + saved + '장 저장됨' + (duplicates ? ' · 작가명 중복 ' + duplicates + '장 제외' : '')
      : '사진을 선택하세요';
    const progress = $('#importProgress'); progress.max = Math.max(1, total); progress.value = done;
    if(S.importing) prog(done / Math.max(1, total));
    // 처리 중인 파일과 아직 남은 파일 위주로 최대 40개만 표시한다.
    const visible = importJobs.filter(j => !importFinished(j)).slice(0, 40);
    $('#importList').innerHTML = visible.map(j => `<div style="padding:7px 0;border-bottom:1px solid var(--line-soft)">
      <span>${importJobs.indexOf(j) + 1}. [${CATS[j.cat === 'uc' ? 'uc' : 'artist']}] ${esc(j.label)}</span> · <b>${esc(j.state)}</b>
      ${j.title ? `<div>제목: ${esc(j.title)}</div>` : ''}
      ${j.error ? `<div style="color:#b44">${esc(j.error)}</div>` : ''}
      ${!S.importing ? `<button data-remove="${j.id}" aria-label="${esc(j.label)} 제외" style="float:right">✕</button>` : ''}
      </div>`).join('') + (total - done > 40 ? `<p>외 ${total - done - 40}장</p>` : '');
    $('#save').disabled = S.importing || done === total;
    $('#save').textContent = S.importing ? '저장 중…' : total && done === total ? '저장 완료' : importJobs.some(j => j.staged || j.ready || j.saved) ? '이어 올리기' : '일괄 저장';
    $('#cancel').textContent = S.importing ? (importStop ? '현재 묶음 저장 후 중단…' : '저장 후 중단') : '닫기';
    $('#cancel').disabled = S.importing && importStop;
    dp.style.opacity = S.importing ? '.5' : '1';
    dp.setAttribute('aria-disabled', String(!!S.importing));
    $('#importHint').textContent = S.importing
      ? '이미지를 업로드하고 있습니다. 완료될 때까지 이 화면을 열어 두세요.'
      : done === total && total ? '저장된 이미지는 각각 별도 항목으로 추가됩니다. 작가명 중복 이미지는 제외되었습니다.'
      : done || errors.length || importJobs.some(j=>j.staged) ? '완료된 항목은 유지됩니다. 같은 브라우저에서 ＋ → 이어 올리기로 남은 작업을 복구할 수 있어요.'
      : '저장하는 동안 이 화면을 열어 두세요. 중단하면 현재 묶음까지 저장합니다.';
  }
  $('#importList').onclick = async e => {
    const b = e.target.closest('[data-remove]'); if(!b || S.importing) return;
    const job = importJobs.find(j => j.id === b.dataset.remove);
    if(job) dropUrls(job.id);
    importJobs = importJobs.filter(j => j.id !== b.dataset.remove);
    try{await checkpointImport(importJobs);if(job) await delBlob(sourceKey(job));}catch(e){toast('대기 목록 저장 실패');}
    paint();
  };
  $('#cancel').onclick = () => {
    if(S.importing){ importStop = true; paint(); return; }
    closeSheet();
  };
  $('#save').onclick = async () => {
    if(S.importing) return;
    try{
      await runImport(importJobs, paint);
      if(importJobs.length && importJobs.every(importFinished)){
        const count = importJobs.filter(j=>j.saved).length, duplicates = importJobs.filter(j=>j.skipped).length;
        closeSheet(); toast(count + '장 저장했습니다' + (duplicates ? ' · 작가명 중복 ' + duplicates + '장 제외' : ''), 6000);
      }
    }
    catch(e){ toast('저장 중단: ' + e.message, 7000); }
  };
  paint();
}


/* ── 수정 ─────────────────────────────────────────────── */
function editSheet(it){
  let addFiles = [], removeKeys = [];
  sheet(`
    <h3>수정</h3>
    <div class="picks" id="ePicks"></div>
    <button class="btn mini" type="button" id="eAdd" style="margin-bottom:15px">이미지 추가</button>
    <input type="file" id="eFile" accept="image/*" multiple hidden>
    <label class="f"><span>이름</span><input id="eName" autocomplete="off"></label>
    ${tagField('eTags', tagsOf(it))}
    <label class="f"><span>탭</span><select id="eCat" style="width:100%;padding:8px 10px;font-size:16px;background:#fff;border:1px solid #e6deee;border-radius:9px;color:#5f506d">
      ${Object.entries(CATS).map(([c, l]) => `<option value="${c}"${catOf(it) === c ? ' selected' : ''}>${l}</option>`).join('')}
    </select></label>
    <div class="btns">
      <button class="btn" id="cancel">취소</button>
      <button class="btn pri" id="save">저장</button>
    </div>`);
  const tf = initTagField('eTags');
  $('#eName').value = it.name;

  async function paintE(){
    const keep = imgsOf(it).filter(g => !removeKeys.includes(g.k));
    const srcs = await Promise.all(keep.map(g => srcOf(g, 'thumb')));
    const box = $('#ePicks'); if(!box) return;                 // 그 사이 창을 닫았을 수 있다
    box.innerHTML =
      keep.map((g, i) => `<div class="pick"><img src="${srcs[i]}" alt=""><span class="no">${i + 1}</span><button class="rm" data-k="${esc(g.k)}" aria-label="빼기"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>`).join('') +
      addFiles.map((f, i) => `<div class="pick"><img src="${previewURL(f)}" alt=""><span class="no">${keep.length + i + 1}</span><button class="rm" data-n="${i}" aria-label="빼기"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>`).join('');
  }
  paintE();
  $('#eAdd').onclick = () => $('#eFile').click();
  $('#eFile').onchange = e => {
    addFiles = addFiles.concat([...e.target.files].filter(f => f.type.startsWith('image/')));
    e.target.value = ''; paintE();
  };
  $('#ePicks').addEventListener('click', e => {
    const b = e.target.closest('.rm'); if(!b) return;
    if(b.dataset.k !== undefined) removeKeys.push(b.dataset.k);
    else addFiles.splice(+b.dataset.n, 1);
    paintE();
  });
  $('#cancel').onclick = closeSheet;
  $('#save').onclick = async () => {
    const b = $('#save');
    if(imgsOf(it).filter(g => !removeKeys.includes(g.k)).length + addFiles.length === 0)
      return toast('사진이 최소 한 장은 있어야 합니다');
    b.disabled = true; b.textContent = '저장 중…';
    try{
      const moved = $('#eCat').value !== catOf(it);
      await updateItem(it.id, $('#eName').value.trim(), tf.get(), addFiles, removeKeys, $('#eCat').value);
      closeSheet(); applyFilter();
      const i = S.view.findIndex(x => x.id === it.id);
      if(i >= 0) openLB(i); else closeLB();
      toast(moved ? CATS[catOf(it)] + ' 탭으로 옮겼습니다' : '수정했습니다');
    }catch(err){ b.disabled = false; b.textContent = '저장'; toast('실패: ' + err.message, 4500); }
  };
}

  sheet(`

    <label class="f"><span>소제목</span><textarea id="hS" rows="2"></textarea>

          <button class="btn mini" type="button" id="hCoverPick">🖼️ 이미지 선택</button>

  cov.onerror = () => { cov.style.visibility = 'hidden'; };
  cov.src = 'cover.jpg?_=' + Date.now();
  const setCover = f => {
    if(!f || !f.type.startsWith('image/')) return;
    coverFile = f;
    cov.style.visibility = ''; cov.src = previewURL(f);
    $('#hCoverNote').textContent = '저장하면 이 그림으로 바뀝니다';

  $('#hCoverFile').onchange = e => { setCover(e.target.files[0]); e.target.value = ''; };
  zone.ondragover  = e => { e.preventDefault(); zone.classList.add('over'); };

  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('over'); setCover(e.dataTransfer.files[0]); };

  $('#cancel').onclick = closeSheet;

    S.site = { title: $('#hT').value.trim() || DEF.title, sub: $('#hS').value.trim(), cover: coverFile ? Date.now().toString(36) : (prev.cover || '') };
    try{
      const changes = [];
      if(coverFile && S.mode === 'github')
        changes.push({ path: 'cover.jpg', blob: await coverImage(coverFile) });
      if(prev.title !== S.site.title || prev.sub !== S.site.sub || coverFile){
        const og = await ogChange();
        if(og) changes.push(og);
      }
      await commitAll(changes, 'edit: site settings');
      paintHead(); closeSheet();
      toast(coverFile ? '저장했습니다 · 링크 미리보기 반영에 1~2분' : '저장했습니다', 3000);
    }
    catch(err){ S.site = prev; paintHead(); b.disabled = false; b.textContent = '저장'; toast('실패: ' + err.message, 4500); }
  };
}

/* ── 관리자 ───────────────────────────────────────────── */
function confirmDelete(message){
  return new Promise(resolve=>{
    const previous = document.activeElement;
    const dialog = document.createElement('dialog');
    dialog.id = 'deleteDialog';
    dialog.setAttribute('aria-labelledby','deleteTitle');
    dialog.setAttribute('aria-describedby','deleteMessage');
    dialog.innerHTML = '<h3 id="deleteTitle">이미지를 삭제할까요?</h3><p id="deleteMessage"></p><div class="btns"><button class="btn" data-cancel autofocus>취소</button><button class="btn danger" data-delete>삭제</button></div>';
    dialog.querySelector('p').textContent = message;
    const finish = value=>{dialog.close();dialog.remove();previous?.focus();resolve(value);};
    dialog.querySelector('[data-cancel]').onclick=()=>finish(false);
    dialog.querySelector('[data-delete]').onclick=()=>finish(true);
    dialog.oncancel=e=>{e.preventDefault();finish(false);};
    dialog.addEventListener('keydown',e=>e.stopPropagation());
    document.body.appendChild(dialog);
    dialog.showModal();
  });
}

function adminSheet(){
  const c = S.cfg || { owner: '', repo: '', branch: 'main', token: '' };
  sheet(`
    <h3 class="admin-heading">관리자 로그인<button id="adminDismiss" type="button" aria-label="닫기">×</button></h3>
    <div class="note">
      GitHub <b>토큰을 입력한 이 기기에서만</b> 편집 버튼이 나타납니다.
      <br>토큰은 이 브라우저에 저장되며 GitHub 인증에 사용됩니다.
    </div>
    <label class="f"><span>GitHub 사용자명</span><input id="cOwner" autocomplete="off"></label>
    <label class="f"><span>저장소 이름</span><input id="cRepo" autocomplete="off"></label>
    <label class="f"><span>브랜치</span><input id="cBranch" autocomplete="off"></label>
    <label class="f"><span>액세스 토큰</span><input id="cToken" type="password" autocomplete="off">
      <span class="tip">Settings → Developer settings → Fine-grained tokens →
      해당 저장소만 선택 → Permissions 에 <code>Contents: Read and write</code></span></label>
    <div class="btns">
      ${S.cfg ? '<button class="btn" id="out">로그아웃</button>' : '<button class="btn" id="cancel">취소</button>'}
      <button class="btn pri" id="save">확인</button>
    </div>`);
  $('#adminDismiss').onclick = closeSheet;
  $('#cOwner').value = c.owner; $('#cRepo').value = c.repo;
  $('#cBranch').value = c.branch || 'main'; $('#cToken').value = c.token;
  $('#cancel') && ($('#cancel').onclick = closeSheet);
  $('#out') && ($('#out').onclick = () => { try{ localStorage.removeItem(CFG_KEY); }catch{} closeSheet(); location.reload(); });

  $('#save').onclick = async () => {
    const b = $('#save'); b.disabled = true; b.textContent = '확인 중…';
    const cfg = {
      owner: $('#cOwner').value.trim(), repo: $('#cRepo').value.trim(),
      branch: $('#cBranch').value.trim() || 'main', token: $('#cToken').value.trim()
    };
    if(!cfg.owner || !cfg.repo || !cfg.token){ b.disabled = false; b.textContent = '확인'; return toast('빈 칸을 채워주세요'); }
    const prev = S.cfg, prevMode = S.mode, prevAdmin = S.admin;
    S.cfg = cfg;
    try{
      await ghReq('GET', `git/ref/heads/${cfg.branch}`);
      const ref = await headInfo();
      let remote = null;
      try{
        let file = await ghReq('GET', 'contents/data.json?ref=' + ref.head);
        if(!file.content && file.sha) file = await ghReq('GET', 'git/blobs/' + file.sha);
        remote = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(file.content.replace(/\s/g,'')), c=>c.charCodeAt(0))));
        if(!Array.isArray(remote.items)) throw new Error('저장된 목록을 읽지 못했습니다. 다시 확인해 주세요.');
      }catch(e){if(e.status !== 404) throw e;}
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      S.admin = true; S.mode = 'github';
      if(remote) applyRemote(remote);
      paintHead();
      setAdminUI(); closeSheet(); applyFilter(); toast('저장했습니다');
    }catch(err){
      S.cfg = prev; S.mode = prevMode; S.admin = prevAdmin;
      b.disabled = false; b.textContent = '확인';
      toast(err.message, 4000);
    }
  };
}

/* ── 시작 ─────────────────────────────────────────────── */
// 예전 형식(항목 하나에 사진 한 장) → imgs 배열로 자동 변환
function normalize(items){
  for(const c of Object.keys(CATS)){
    const group = (items || []).filter(it => catOf(it) === c);
    let next = Math.max(0, ...group.map(it => Number.isSafeInteger(it.no) && it.no > 0 ? it.no : 0));
    const missing = group.filter(it => !Number.isSafeInteger(it.no) || it.no < 1).sort((a,b) => (a.ts || 0) - (b.ts || 0));
    missing.forEach(it => { it.no = ++next; });
  }
  return (items || []).map(it => {
    if(!Array.isArray(it.tags)) it.tags = it.desc ? parseTags(it.desc) : [];
    delete it.desc;
    if(!Array.isArray(it.imgs)){
      it.imgs = (it.src || it.thumb)
        ? [{ k: it.id, src: it.src, thumb: it.thumb, w: it.w, h: it.h }] : [];
      delete it.src; delete it.thumb; delete it.w; delete it.h;
    }
    return it;
  });
}
(async function init(){
  try{ await boot(); }
  catch(err){ console.error(err); paintHead(); setAdminUI(); applyFilter(); toast('불러오는 중 문제가 발생했습니다', 4000); }
})();

async function boot(){
  try{ S.cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); }catch{}
  const remote = await fetchData();

  if(remote && Array.isArray(remote.items)){
    S.mode  = 'github';
    applyRemote(remote);
    S.admin = !!(S.cfg && S.cfg.token);
  }else{
    S.mode  = 'local';
    S.items = normalize(await getMeta('items'));
    S.site  = { ...DEF, ...((await getMeta('site')) || {}) };
    S.admin = location.protocol === 'file:' || ['localhost','127.0.0.1'].includes(location.hostname);
  }
  paintHead(); setAdminUI(); applyFilter();
  if(!S.admin && new URLSearchParams(location.search).get('admin') === '1') adminSheet();

  // index.html 을 새로 올린 직후라면 링크 미리보기 주소를 한 번만 자동으로 채운다
  const og = document.querySelector('meta[property="og:url"]');
  if(S.admin && S.mode === 'github' && og && og.content.includes('__SITE__')){
    try{
      const ch = await ogChange();
      if(ch){ await commitAll([ch], 'set link preview'); toast('링크 미리보기를 설정했습니다', 3000); }
    }catch(e){ console.warn('og 자동설정 실패', e); }
  }
}
