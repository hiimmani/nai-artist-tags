<title>NAI 작태 모음</title>
<style>
/* ═══ 🌸 벚꽃 (기본) ═══════════════════ */
:root{
  --bg:#ffeef3;
  --card:#ffffff;
  --line:#ffd4e0;
  --line-soft:#ffe6ee;
  --text:#b0798c;
  --muted:#dda8bb;
  --rose:#ffb7cd;
  --rose-deep:#f08cb0;
  --rose-soft:#fff0f5;
  --rose-chip:#fff4f8;
  --grad:linear-gradient(160deg,#ffb3ca,#f286ac);
  --glow:240,140,180;
  --c-ovl:122,62,88;
  --c-ovl2:70,30,45;
  --c-title:#ea87ac;
  --c-sub:#f3a8c3;
  --c-name:#bd6b8a;
  --c-cardtag:#e8a6c0;
  --c-count:#d9739e;
  --c-tagtext:#dd7ea6;
  --c-soft:#dd8fae;
  --c-hint:#e6b0c4;
  --c-faint:#f0c2d3;
  --c-toast:#d2699a;
  --c-imgbg:#ffe4ed;
  --c-dropline:#ffc4d8;
  --c-dropbg:#fff8fb;
  --c-inputbg:#fffafc;
  --c-grip:#ffdbe6;
  --c-skel2:#ffdde8;
  --c-code:#ffe0ec;
  --shadow:0 2px 4px rgba(var(--glow),.08), 0 8px 20px rgba(var(--glow),.12);
  --shadow-lift:0 6px 14px rgba(var(--glow),.15), 0 18px 38px rgba(var(--glow),.20);
  --r:22px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* ═══ ☁️ 하늘 ═════════════════════════ */
:root[data-theme="sky"]{
  --bg:#e9f6ff;
  --line:#c9e8fb;
  --line-soft:#ddf1fe;
  --text:#6f96b0;
  --muted:#a6cadd;
  --rose:#8ed4f5;
  --rose-deep:#4badde;
  --rose-soft:#eff8ff;
  --rose-chip:#f5fbff;
  --grad:linear-gradient(160deg,#93d4f3,#4fabdd);
  --glow:110,180,225;
  --c-ovl:40,84,110;
  --c-ovl2:18,50,70;
  --c-title:#63b8e6;
  --c-sub:#8fcaea;
  --c-name:#52859f;
  --c-cardtag:#a0cfe8;
  --c-count:#3f96c4;
  --c-tagtext:#479ecb;
  --c-soft:#6cb2d8;
  --c-hint:#a3cee6;
  --c-faint:#bcdcf0;
  --c-toast:#3a8db8;
  --c-imgbg:#dff2fd;
  --c-dropline:#b3ddf5;
  --c-dropbg:#f7fcff;
  --c-inputbg:#fafdff;
  --c-grip:#d4edfb;
  --c-skel2:#d8eefc;
  --c-code:#daeffc;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.55;overflow-wrap:anywhere;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ── 헤더 ───────────────────────────── */
header{padding:44px 0 10px;text-align:center}
@media (min-width:700px){header{padding:64px 0 14px}}
h1{
  margin:0;font-size:clamp(29px,7vw,46px);font-weight:750;
  letter-spacing:-.02em;color:var(--c-title);
}
.sub{margin:10px 0 0;font-size:clamp(14px,3.6vw,18px);font-weight:600;color:var(--c-sub)}
#editHead{
  display:none;margin:16px auto 0;padding:8px 18px;border-radius:999px;
  background:#fff;color:var(--rose-deep);font-size:13.5px;font-weight:700;
  box-shadow:var(--shadow);
}
#editHead.on{display:inline-block}
#themeBtn{
  position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:45;
  width:42px;height:42px;border-radius:50%;background:var(--card);
  font-size:19px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow);
  transition:transform .16s;
}
#themeBtn:active{transform:scale(.9)}
.seg{display:flex;gap:8px}
.seg button{
  flex:1;padding:13px;border-radius:14px;background:var(--rose-soft);
  color:var(--c-soft);font-size:14.5px;font-weight:750;border:2px solid transparent;
}
.seg button.on{background:var(--card);border-color:var(--rose);color:var(--c-count)}

/* ── 검색 ───────────────────────────── */
.bar{
  position:sticky;top:0;z-index:30;
  padding:16px 0 10px;margin-top:10px;
  background:var(--bg);                 /* 배경과 같은 단색 → 네모 박스 안 보임 */
}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:20px;width:20px;height:20px;stroke:var(--c-faint);fill:none;stroke-width:2.2;pointer-events:none}
#q{
  width:100%;padding:15px 46px 15px 50px;
  border:2px solid transparent;border-radius:999px;
  background:var(--card);box-shadow:var(--shadow);
  font-size:16px;font-weight:500;outline:none;
  transition:border-color .16s,box-shadow .16s;
}
#q::placeholder{color:var(--c-faint);font-weight:500}
#q:focus{border-color:var(--rose);box-shadow:var(--shadow-lift)}
#clearQ{position:absolute;right:10px;width:32px;height:32px;border-radius:50%;display:none;place-items:center;color:var(--muted);font-size:17px;line-height:1}
#clearQ.on{display:grid}
#clearQ:hover{background:var(--rose-soft)}

/* ── 장수 · 추가 · 정렬 ─────────────── */
.meta{display:flex;align-items:center;gap:9px;margin-top:14px;padding:0 2px;flex-wrap:wrap}
.count{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 17px;border-radius:999px;background:#fff;color:var(--c-count);
  font-weight:800;font-size:14.5px;white-space:nowrap;box-shadow:var(--shadow);
}
.count b{font-variant-numeric:tabular-nums}
.count.clickable{cursor:pointer}
.count .x{font-size:13px;opacity:.6}
.meta .grow{flex:1}
#addTop{
  display:none;align-items:center;gap:6px;
  padding:9px 17px;border-radius:999px;background:var(--grad);color:#fff;
  font-size:14.5px;font-weight:800;box-shadow:0 4px 14px rgba(var(--glow),.38);
}
#addTop.on{display:inline-flex}
#sort{
  border:0;background:#fff;border-radius:999px;
  padding:9px 14px;font-size:14px;font-weight:600;color:var(--c-soft);
  box-shadow:var(--shadow);outline:none;
}

/* ── 태그 ───────────────────────────── */
.tags{display:none;gap:8px;margin-top:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tags::-webkit-scrollbar{display:none}
.tags.on{display:flex}
.tag{
  flex:none;padding:8px 15px;border-radius:999px;background:#fff;
  color:var(--c-tagtext);font-size:13.5px;font-weight:700;white-space:nowrap;
  box-shadow:var(--shadow);transition:transform .14s,background .14s,color .14s;
}
.tag .n{opacity:.45;margin-left:5px;font-variant-numeric:tabular-nums}
.tag.sel{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(var(--glow),.38)}
.tag.sel .n{opacity:.8}
.tag:active{transform:scale(.95)}
@media (hover:hover){.tag:not(.sel):hover{background:var(--rose-chip)}}

/* ── 그리드 ─────────────────────────── */
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:16px 0 44px}
@media (min-width:700px){#grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;padding-bottom:60px}}
.card{
  content-visibility:auto;contain-intrinsic-size:auto 240px;
  background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s;
  display:flex;flex-direction:column;
}
@media (hover:hover){.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}}
.card .thumb{
  position:relative;aspect-ratio:3/4;background:var(--c-imgbg);
  overflow:hidden;display:block;width:100%;padding:0;border-radius:0;
}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s ease}
.card .thumb img.ready{opacity:1}
.card .thumb:active{opacity:.85}
.cap{padding:9px 10px 11px}
@media (min-width:700px){.cap{padding:12px 14px 14px}}
.nm{
  display:flex;align-items:flex-start;gap:4px;width:100%;text-align:left;
  font-size:12.5px;font-weight:750;color:var(--c-name);line-height:1.35;
  padding:2px 4px;margin:-2px -4px;border-radius:9px;transition:background .14s;
}
@media (min-width:700px){.nm{font-size:14.5px}}
.nm .t{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nm .ci{flex:none;font-size:11px;opacity:.32;margin-top:1px}
@media (hover:hover){.nm:hover{background:var(--rose-chip)}.nm:hover .ci{opacity:.8}}
.nm:active{background:var(--rose-soft)}
.nm.copied{background:#e7f5ec;color:#3f8a5f}
.tg{
  margin-top:5px;font-size:11px;color:var(--c-cardtag);font-weight:650;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
@media (min-width:700px){.tg{font-size:12.5px}}

.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:14px;opacity:.55}
.empty p{margin:6px 0;font-size:15px;font-weight:600}
.empty .hint{font-size:13.5px;color:var(--c-hint);font-weight:500}

/* ── 라이트박스 ─────────────────────── */
.lb{position:fixed;inset:0;z-index:100;display:none;background:rgba(var(--c-ovl),.66);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.lb.on{display:block}
.lb-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(60px + env(safe-area-inset-top,0px)) 14px calc(30px + var(--safe-b))}
.lb-inner{max-width:720px;margin:0 auto}
.lb-img{width:100%;border-radius:18px;display:block;background:var(--c-imgbg);box-shadow:0 20px 54px rgba(var(--c-ovl2),.42)}
.lb-info{margin-top:16px;background:var(--card);border-radius:var(--r);padding:18px 18px 20px;box-shadow:0 12px 32px rgba(var(--c-ovl2),.22)}
#lbName{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  font-size:20px;font-weight:800;color:var(--c-title);line-height:1.35;
  padding:8px 12px;margin:-8px -12px;border-radius:14px;transition:background .14s;
}
#lbName .ci{flex:none;font-size:14px;opacity:.38;margin-top:4px}
@media (hover:hover){#lbName:hover{background:var(--rose-chip)}}
#lbName:active{background:var(--rose-soft)}
#lbName.copied{background:#e7f5ec;color:#3f8a5f}
.cphint{margin:9px 0 0;font-size:12px;color:var(--c-hint);font-weight:600}
.lb-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.lb-tags .t{padding:7px 14px;border-radius:999px;background:var(--rose-chip);color:var(--c-count);font-size:13px;font-weight:700}
.lb-tags .none{color:var(--c-faint);font-size:13px;padding:7px 0;font-weight:600}
.lb-actions{display:flex;gap:9px;margin-top:17px}
.lb-actions button{flex:1;padding:12px;border-radius:14px;font-size:14px;font-weight:750;background:var(--rose-chip);color:var(--c-count)}
.lb-actions .del{background:#fdecec;color:#c9636c}
.lb-top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:2;pointer-events:none}
.lb-top>*{pointer-events:auto}
.icob{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--c-count);font-size:20px;line-height:1;box-shadow:0 4px 14px rgba(var(--c-ovl2),.26)}
.lb-pos{padding:8px 15px;border-radius:999px;background:#fff;color:var(--c-count);font-size:13px;font-weight:750;font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgba(var(--c-ovl2),.26)}
.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:#fff;color:var(--c-count);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 14px rgba(var(--c-ovl2),.26);z-index:3}
.nav.prev{left:12px}.nav.next{right:12px}
@media (max-width:700px){.nav{display:none}}

/* ── 하단 버튼 ──────────────────────── */
.fab{
  position:fixed;right:18px;bottom:calc(18px + var(--safe-b));z-index:40;
  width:60px;height:60px;border-radius:50%;
  background:var(--grad);color:#fff;
  font-size:30px;font-weight:300;line-height:1;display:none;place-items:center;
  box-shadow:0 8px 24px rgba(var(--glow),.5);
}
.fab.on{display:grid}
.fab:active{transform:scale(.93)}
.lockrow{padding:6px 0 44px;text-align:center}
#lockBtn{font-size:12.5px;color:var(--c-hint);padding:9px 16px;border-radius:999px;font-weight:600}
#lockBtn:hover{background:#fff;color:var(--c-count)}

/* ── 시트 ───────────────────────────── */
.sheet{position:fixed;inset:0;z-index:120;display:none;background:rgba(var(--c-ovl),.48);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet.on{display:block}
.sheet-box{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;background:var(--card);
  border-radius:28px 28px 0 0;padding:8px 20px calc(22px + var(--safe-b));
  box-shadow:0 -10px 44px rgba(var(--c-ovl2),.3);animation:up .26s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:720px){
  .sheet-box{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:540px;border-radius:26px;max-height:88vh}
  @keyframes up{from{transform:translate(-50%,-46%);opacity:.4}to{transform:translate(-50%,-50%);opacity:1}}
}
.grip{width:42px;height:5px;border-radius:99px;background:var(--c-grip);margin:7px auto 16px}
@media (min-width:720px){.grip{display:none}}
.sheet h3{margin:2px 0 18px;font-size:19px;font-weight:800;color:var(--c-title)}

label.f{display:block;margin-bottom:15px}
label.f>span:first-child{display:block;font-size:13.5px;font-weight:750;color:var(--c-tagtext);margin-bottom:7px}
label.f input{
  width:100%;padding:13px 15px;border:2px solid var(--line-soft);border-radius:14px;
  background:var(--c-inputbg);font-size:16px;outline:none;transition:border-color .16s;
}
label.f input:focus{border-color:var(--rose)}
label.f .tip{font-size:12.5px;color:var(--c-hint);margin-top:6px;font-weight:500;display:block}

.taginput{display:flex;flex-wrap:wrap;align-items:center;gap:7px;border:2px solid var(--line-soft);border-radius:14px;background:var(--c-inputbg);padding:8px 10px;transition:border-color .16s}
.taginput.focus{border-color:var(--rose)}
.taginput .chip{display:inline-flex;align-items:center;gap:5px;padding:6px 8px 6px 13px;border-radius:999px;background:var(--rose-chip);color:var(--c-count);font-size:13.5px;font-weight:750}
.taginput .chip b{cursor:pointer;font-size:14px;opacity:.5;font-weight:800;padding:0 2px}
.taginput .chip b:hover{opacity:1}
.taginput input{flex:1;min-width:90px;width:90px;border:0;outline:none;background:none;padding:6px 3px;font-size:16px}

.drop{border:2.5px dashed var(--c-dropline);border-radius:20px;background:var(--c-dropbg);padding:26px 14px;text-align:center;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:16px;cursor:pointer;transition:background .16s,border-color .16s}
.drop:hover,.drop.over{background:var(--rose-soft);border-color:var(--rose)}
.drop .ic{font-size:30px;display:block;margin-bottom:8px;opacity:.75}
.drop .dim{color:var(--c-faint)}

.one{display:flex;gap:14px;align-items:flex-start;margin-bottom:15px}
.one img{width:82px;height:110px;object-fit:cover;border-radius:14px;flex:none;background:var(--c-imgbg)}
.one .fill{flex:1;min-width:0}
.one .fill label.f{margin-bottom:0}
.cover-prev{width:124px;height:65px;object-fit:cover;border-radius:12px;flex:none;background:var(--c-imgbg)}
.rows{max-height:42vh;overflow-y:auto;margin-bottom:15px;padding-right:2px}
.nrow{display:flex;gap:11px;align-items:center;margin-bottom:9px}
.nrow img{width:46px;height:62px;object-fit:cover;border-radius:11px;flex:none;background:var(--c-imgbg)}
.nrow input{flex:1;min-width:0;padding:11px 13px;border:2px solid var(--line-soft);border-radius:12px;background:var(--c-inputbg);font-size:16px;outline:none}
.nrow input:focus{border-color:var(--rose)}
.rowhead{font-size:13.5px;font-weight:750;color:var(--c-tagtext);margin-bottom:8px}

.btns{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:15px;border-radius:16px;font-size:15px;font-weight:800;background:var(--rose-soft);color:var(--c-soft)}
.btn.pri{background:var(--grad);color:#fff;box-shadow:0 5px 16px rgba(var(--glow),.4)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.mini{flex:none;padding:11px 16px;font-size:13.5px;border-radius:13px}
.note{background:var(--rose-chip);border-radius:14px;padding:13px 15px;font-size:12.5px;color:var(--c-soft);line-height:1.7;margin-bottom:16px;font-weight:500}
.note b{color:var(--c-count)}
.note code{background:var(--c-code);padding:2px 6px;border-radius:6px;font-size:12px}

#prog{position:fixed;left:0;top:0;height:4px;width:0;z-index:200;background:var(--grad);transition:width .25s ease,opacity .3s}
#toast{
  position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%) translateY(12px);
  z-index:210;opacity:0;pointer-events:none;background:var(--c-toast);color:#fff;
  padding:13px 22px;border-radius:999px;font-size:14px;font-weight:700;
  box-shadow:0 10px 30px rgba(var(--c-ovl2),.36);transition:opacity .22s,transform .22s;
  max-width:calc(100vw - 32px);text-align:center;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{background:linear-gradient(100deg,var(--rose-soft) 30%,var(--c-skel2) 50%,var(--rose-soft) 70%);background-size:220% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-220% 0}}
</style>
</head>
<body>

<div id="prog"></div>

<div class="wrap">
  <header>
    <h1 id="siteTitle">NAI 작태 모음</h1>
    <p class="sub" id="siteSub">V5 기준 계속 추가 됨</p>
    <button id="editHead">✎ 제목 수정</button>
  </header>

  <div class="bar" id="bar">
    <div class="search">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
      <input id="q" type="search" placeholder="이름 · 태그로 검색" autocomplete="off" enterkeyhint="search">
      <button id="clearQ" aria-label="검색어 지우기">✕</button>
    </div>
  </div>

  <div class="meta">
    <span class="count" id="count">총 <b>0</b>장</span>
    <button id="addTop">＋ 이미지 추가</button>
    <span class="grow"></span>
    <select id="sort" aria-label="정렬">
      <option value="new">최신순</option>
      <option value="old">오래된순</option>

    </select>
  </div>

  <div class="tags" id="tagbar"></div>

<button class="fab" id="fab" aria-label="이미지 추가">＋</button>

<div class="lb" id="lb">
  <div class="lb-scroll" id="lbScroll">
    <div class="lb-inner">
      <img class="lb-img" id="lbImg" alt="">
      <div class="lb-info">
        <button id="lbName"><span class="t"></span><span class="ci">⧉</span></button>
        <p class="cphint">이름을 누르면 복사됩니다</p>
        <div class="lb-tags" id="lbTags"></div>
        <div class="lb-actions" id="lbActions" style="display:none">
          <button id="lbEdit">✎ 수정</button>
          <button id="lbDel" class="del">삭제</button>

</div>

<div class="sheet" id="sheet"><div class="sheet-box" id="sheetBox"></div></div>
<div id="toast"></div>

<script>
/* =========================================================
   NAI 작태 모음 — 단일 파일 갤러리
   github 모드 : Git Data API 로 한 번에 커밋 (여러 장 업로드 안전)
   local  모드 : 브라우저(IndexedDB)에만 저장
   ========================================================= */
const $ = s => document.querySelector(s);
const CFG_KEY = 'nai_gallery_cfg_v1';
const CHUNK = 60;
const THUMB = { max: 420,  q: .72 };
const FULL  = { max: 1600, q: .86 };
const DEF   = { title: 'NAI 작태 모음', sub: 'V5 기준 계속 추가 됨', theme: 'sakura', cover: '' };
const THEME_KEY = 'nai_theme_v1';
const THEMES = { sakura: { icon: '🌸', bg: '#ffeef3', label: '벚꽃' },
                 sky:    { icon: '☁️', bg: '#e9f6ff', label: '하늘' } };

const S = {
  items: [], site: { ...DEF },
  view: [], drawn: 0, tag: null,
  mode: 'local', cfg: null, admin: false,
  cur: -1, urls: new Map()
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let toastT;
function toast(msg, ms = 2200){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
function prog(p){
  const el = $('#prog');
  if(p === null){ el.style.opacity = 0; setTimeout(() => { el.style.width = 0; el.style.opacity = 1; }, 320); return; }
  el.style.width = (p * 100) + '%';
}

/* ── 복사 ─────────────────────────────────────────────── */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch{}
  try{
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.top = '-1000px';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    return ok;
  }catch{ return false; }
}
async function copyFrom(el, text){
  const ok = await copyText(text);
  if(!ok) return toast('복사에 실패했습니다');
  toast('복사됨 · ' + text);
  el.classList.add('copied');
  setTimeout(() => el.classList.remove('copied'), 900);
}

/* ── 태그 ─────────────────────────────────────────────── */
function parseTags(str){
  return String(str || '').split(/[\s,]+/)
    .map(t => t.replace(/^#+/, '').trim()).filter(Boolean)
    .filter((t, i, a) => a.indexOf(t) === i).slice(0, 20);
}
const tagsOf = it => Array.isArray(it.tags) ? it.tags : [];

/* ── IndexedDB ────────────────────────────────────────── */
let dbP;
function db(){
  return dbP ||= new Promise((res, rej) => {
    const r = indexedDB.open('nai_gallery', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
      if(!d.objectStoreNames.contains('meta'))  d.createObjectStore('meta');
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function idb(store, mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode);
    const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror    = () => rej(tx.error);
  });
}
const soft = (p, fb = null) => p.catch(() => fb);
const putBlob = (k, v) => idb('blobs', 'readwrite', s => s.put(v, k));
const getBlob = k      => soft(idb('blobs', 'readonly',  s => s.get(k)));
const delBlob = k      => soft(idb('blobs', 'readwrite', s => s.delete(k)));
const putMeta = ()     => idb('meta', 'readwrite', s => { s.put(S.items, 'items'); return s.put(S.site, 'site'); });
const getMeta = k      => soft(idb('meta', 'readonly', s => s.get(k)));

/* ── 리사이즈 → WebP ──────────────────────────────────── */
async function variant(file, opt){
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { throw new Error('이미지를 읽을 수 없습니다'); }
  const scale = Math.min(1, opt.max / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale));
  const h = Math.max(1, Math.round(bmp.height * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, 0, 0, w, h);
  bmp.close?.();
  const blob = await new Promise(r => c.toBlob(r, 'image/webp', opt.q))
            || await new Promise(r => c.toBlob(r, 'image/jpeg', opt.q));
  return { blob, w, h };
}
// 링크 미리보기용 1200×630 (가운데를 잘라 채운다. 세로 사진은 윗부분이 더 보이게)
async function coverImage(file){
  const W = 1200, H = 630;
  let bmp;
  try { bmp = await createImageBitmap(file); }
  catch { throw new Error('이미지를 읽을 수 없습니다'); }
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#ffeef3'; ctx.fillRect(0, 0, W, H);
  const s = Math.max(W / bmp.width, H / bmp.height);
  const dw = bmp.width * s, dh = bmp.height * s;
  ctx.drawImage(bmp, (W - dw) / 2, (H - dh) * .25, dw, dh);
  bmp.close?.();
  return new Promise(r => c.toBlob(r, 'image/jpeg', .85));   // 카톡 호환 위해 jpeg
}
const b64 = blob => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload  = () => res(String(fr.result).split(',')[1]);
  fr.onerror = rej;
  fr.readAsDataURL(blob);
});

/* ── GitHub (Git Data API) ────────────────────────────── */
const api = p => `https://api.github.com/repos/${S.cfg.owner}/${S.cfg.repo}/${p}`;
const ghHead = () => ({
  Authorization: 'Bearer ' + S.cfg.token,
  Accept: 'application/vnd.github+json',
  'X-GitHub-Api-Version': '2022-11-28'
});
async function ghReq(method, path, body){
  const r = await fetch(api(path), {
    method, headers: ghHead(),
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store'
  });
  if(!r.ok){
    const txt = await r.text();
    if(r.status === 401) throw new Error('토큰이 올바르지 않습니다');
    if(r.status === 403) throw new Error('권한이 없습니다 (토큰의 Contents 권한 확인)');
    if(r.status === 404) throw new Error('저장소나 브랜치를 찾을 수 없습니다');
    const e = new Error(`GitHub 오류 ${r.status}: ` + txt.slice(0, 140));
    e.status = r.status; e.body = txt;
    throw e;
  }
  return r.status === 204 ? null : r.json();
}

// changes: [{path, b64}] 추가·교체 / [{path, del:true}] 삭제 — 전부 한 커밋으로
async function ghCommit(changes, message){
  // 1) blob 먼저 만들어 둔다 (충돌로 재시도해도 다시 안 올리도록)
  const tree = [];
  for(const c of changes){
    if(c.del){ tree.push({ path: c.path, mode: '100644', type: 'blob', sha: null }); continue; }
    const b = await ghReq('POST', 'git/blobs', { content: c.b64, encoding: 'base64' });
    tree.push({ path: c.path, mode: '100644', type: 'blob', sha: b.sha });
  }
  // 2) 커밋 — 다른 기기와 겹치면 최신 것을 다시 읽어 재시도
  let lastErr;
  for(let i = 0; i < 4; i++){
    try{
      const ref  = await ghReq('GET', `git/ref/heads/${S.cfg.branch}`);
      const head = ref.object.sha;
      const base = (await ghReq('GET', `git/commits/${head}`)).tree.sha;
      const nt = await ghReq('POST', 'git/trees', { base_tree: base, tree });
      const nc = await ghReq('POST', 'git/commits', { message, tree: nt.sha, parents: [head] });
      await ghReq('PATCH', `git/refs/heads/${S.cfg.branch}`, { sha: nc.sha });
      return;
    }catch(e){
      lastErr = e;
      if(e.status !== 409 && e.status !== 422) throw e;
      await sleep(700 * (i + 1));
    }
  }
  throw lastErr;
}

function utf8b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';                                   // 스택 오버플로 방지를 위해 나눠서 변환
  for(let i = 0; i < bytes.length; i += 0x8000)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function dataB64(){
  return utf8b64(JSON.stringify({ version: 2, title: S.site.title, sub: S.site.sub,
    theme: S.site.theme, cover: S.site.cover || '', updated: new Date().toISOString(), items: S.items }, null, 1));
}

/* ── 링크 미리보기(og) 태그 자동 갱신 ─────────────────────
   카톡·디스코드는 자바스크립트를 실행하지 않고 HTML 만 읽어간다.
   그래서 제목·주소·썸네일을 index.html 안에 직접 써 넣어야 한다.       */
function siteBase(){
  return location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '');
}
const escAttr = s => String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

function setMeta(html, key, val){
  const attr = key.startsWith('og:') ? 'property' : 'name';
  const re = new RegExp(`(<meta\\s+${attr}="${key}"\\s+content=")[^"]*(")`, 'i');
  return html.replace(re, (m, a, b) => a + escAttr(val) + b);
}
// 성공하면 커밋할 변경사항, 아니면 null (실패해도 사이트는 그대로)
async function ogChange(){
  if(S.mode !== 'github' || !S.cfg) return null;
  if(!/^https?:$/.test(location.protocol)) return null;   // 내 PC 파일로 열었을 땐 건드리지 않는다
  let html;
  try{
    const r = await fetch(api('contents/index.html?ref=' + S.cfg.branch),
      { headers: { ...ghHead(), Accept: 'application/vnd.github.raw' }, cache: 'no-store' });
    if(!r.ok) return null;
    html = await r.text();
  }catch{ return null; }

  const base = siteBase();
  const img  = base + 'cover.jpg' + (S.site.cover ? '?v=' + S.site.cover : '');
  let out = html;
  out = setMeta(out, 'og:site_name',        S.site.title);
  out = setMeta(out, 'og:title',            S.site.title);
  out = setMeta(out, 'og:description',      S.site.sub);
  out = setMeta(out, 'twitter:title',       S.site.title);
  out = setMeta(out, 'twitter:description', S.site.sub);
  out = setMeta(out, 'og:url',              base);
  out = setMeta(out, 'og:image',            img);
  out = setMeta(out, 'twitter:image',       img);

  // 망가뜨리지 않았는지 확인한 뒤에만 커밋한다
  const ok = out !== html
    && /<\/html>/i.test(out) && /id="grid"/.test(out) && /<title>/i.test(out)
    && !new RegExp('content="__' + 'SITE__').test(out)   // 문자열을 쪼개 둔다. 안 그러면 이 검사 코드 자체에 걸린다
    && Math.abs(out.length - html.length) < html.length * .1;
  return ok ? { path: 'index.html', b64: utf8b64(out) } : null;
}
async function commitAll(changes, message){
  if(S.mode !== 'github') return putMeta();
  try{
    await ghCommit([...changes, { path: 'data.json', b64: dataB64() }], message);
  }catch(e){
    // 지울 파일이 이미 없으면 트리 생성이 실패한다 → 삭제만 빼고 다시
    if(e.status === 422 && changes.some(c => c.del)){
      await ghCommit([...changes.filter(c => !c.del), { path: 'data.json', b64: dataB64() }], message);
      return;
    }
    throw e;
  }
}

/* ── 이미지 경로 ──────────────────────────────────────── */
async function srcOf(it, which){
  const key = it.id + (which === 'thumb' ? '_t' : '_f');
  if(S.urls.has(key)) return S.urls.get(key);      // 방금 올린 건 배포 전에도 바로 표시
  if(S.mode === 'github') return which === 'thumb' ? it.thumb : it.src;
  const b = await getBlob(key);
  if(!b) return '';
  const u = URL.createObjectURL(b);
  S.urls.set(key, u);
  return u;
}
function cacheLocal(id, tBlob, gBlob){
  ['_t','_f'].forEach(s => { const u = S.urls.get(id + s); if(u) URL.revokeObjectURL(u); });
  S.urls.set(id + '_t', URL.createObjectURL(tBlob));
  S.urls.set(id + '_f', URL.createObjectURL(gBlob));
}

/* ── 추가 / 수정 / 삭제 ───────────────────────────────── */
async function addImages(files, names, tags){
  const changes = [], made = [];
  try{
    for(let i = 0; i < files.length; i++){
      const t = await variant(files[i], THUMB);
      const g = await variant(files[i], FULL);
      const id = uid();
      const ext = g.blob.type === 'image/webp' ? 'webp' : 'jpg';
      const item = { id, name: (names[i] || '').trim() || '이름 없음', tags: tags.slice(), w: g.w, h: g.h, ts: Date.now() + i };
      if(S.mode === 'github'){
        item.thumb = `thumbs/${id}.${ext}`;
        item.src   = `images/${id}.${ext}`;
        changes.push({ path: item.thumb, b64: await b64(t.blob) },
                     { path: item.src,   b64: await b64(g.blob) });
      }else{
        await putBlob(id + '_t', t.blob);
        await putBlob(id + '_f', g.blob);
      }
      cacheLocal(id, t.blob, g.blob);
      made.push(item);
      prog(((i + 1) / files.length) * .55);
    }
    S.items.push(...made);
    try{ await commitAll(changes, `add ${made.length} image(s)`); }
    catch(e){ made.forEach(m => { const i = S.items.indexOf(m); if(i >= 0) S.items.splice(i, 1); }); throw e; }
    prog(1);
  } finally { prog(null); }
}

async function updateItem(id, name, tags, file){
  const it = S.items.find(x => x.id === id);
  if(!it) return;
  const before = { name: it.name, tags: it.tags, src: it.src, thumb: it.thumb, w: it.w, h: it.h };
  const changes = [];
  try{
    if(file){
      const t = await variant(file, THUMB);
      const g = await variant(file, FULL);
      prog(.5);
      if(S.mode === 'github'){
        if(it.thumb) changes.push({ path: it.thumb, del: true });
        if(it.src)   changes.push({ path: it.src,   del: true });
        const nid = uid(), ext = g.blob.type === 'image/webp' ? 'webp' : 'jpg';
        it.thumb = `thumbs/${nid}.${ext}`;
        it.src   = `images/${nid}.${ext}`;
        changes.push({ path: it.thumb, b64: await b64(t.blob) },
                     { path: it.src,   b64: await b64(g.blob) });
      }else{
        await putBlob(id + '_t', t.blob);
        await putBlob(id + '_f', g.blob);
      }
      it.w = g.w; it.h = g.h;
      cacheLocal(id, t.blob, g.blob);
    }
    it.name = name; it.tags = tags;
    try{ await commitAll(changes, `edit: ${name}`); }
    catch(e){ Object.assign(it, before); throw e; }
  } finally { prog(null); }
}

async function removeItem(id){
  const i = S.items.findIndex(x => x.id === id);
  if(i < 0) return;
  const it = S.items[i];
  S.items.splice(i, 1);
  const changes = [];
  if(S.mode === 'github'){
    if(it.thumb) changes.push({ path: it.thumb, del: true });
    if(it.src)   changes.push({ path: it.src,   del: true });
  }
  try{ await commitAll(changes, `delete: ${it.name}`); }
  catch(e){ S.items.splice(i, 0, it); throw e; }
  if(S.mode !== 'github'){ await delBlob(id + '_t'); await delBlob(id + '_f'); }
  ['_t','_f'].forEach(s => { const u = S.urls.get(id + s); if(u) URL.revokeObjectURL(u); S.urls.delete(id + s); });
}

/* ── 테마 ─────────────────────────────────────────────── */
// 방문자가 버튼으로 고른 색이 우선, 없으면 관리자가 정한 사이트 기본색
function resolveTheme(){
  let v = null;
  try{ v = localStorage.getItem(THEME_KEY); }catch{}
  if(THEMES[v]) return v;
  return THEMES[S.site.theme] ? S.site.theme : 'sakura';
}
function applyTheme(t){
  if(!THEMES[t]) t = 'sakura';
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', THEMES[t].bg);
  $('#themeBtn').textContent = THEMES[t].icon;
}
$('#themeBtn').onclick = () => {
  // 저장이 막힌 브라우저에서도 왔다 갔다 되도록 지금 화면에 적용된 값을 기준으로 뒤집는다
  const now = document.documentElement.getAttribute('data-theme') === 'sky' ? 'sky' : 'sakura';
  const t = now === 'sky' ? 'sakura' : 'sky';
  try{ localStorage.setItem(THEME_KEY, t); }catch{}
  applyTheme(t);
  toast(THEMES[t].label + '색으로 바꿨어요', 1500);
};

/* ── 헤더 ─────────────────────────────────────────────── */
function paintHead(){
  $('#siteTitle').textContent = S.site.title;
  $('#siteSub').textContent   = S.site.sub;
  $('#siteSub').style.display = S.site.sub ? '' : 'none';
  document.title = S.site.title;
}

/* ── 렌더 ─────────────────────────────────────────────── */
const grid = $('#grid');
let io, ioMore;

function applyFilter(){
  const q = $('#q').value.trim().toLowerCase();
  let v = S.items;
  if(S.tag) v = v.filter(it => tagsOf(it).includes(S.tag));
  if(q) v = v.filter(it => (it.name || '').toLowerCase().includes(q) || tagsOf(it).some(t => t.toLowerCase().includes(q)));
  v = v.slice();
  const s = $('#sort').value;
  if(s === 'new')      v.sort((a, b) => b.ts - a.ts);
  else if(s === 'old') v.sort((a, b) => a.ts - b.ts);
  else                 v.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));
  S.view = v; S.drawn = 0;
  grid.innerHTML = '';
  drawMore(); paintCount(q); paintTags();
}
function paintCount(q){
  const el = $('#count'), total = S.items.length.toLocaleString('ko-KR');
  el.classList.toggle('clickable', !!S.tag);
  if(S.tag)  el.innerHTML = `#${esc(S.tag)} <b>${S.view.length}</b>장 <span class="x">✕</span>`;
  else if(q) el.innerHTML = `검색 <b>${S.view.length}</b>장 · 전체 ${total}장`;
  else       el.innerHTML = `총 <b>${total}</b>장`;
}
function paintTags(){
  const bar = $('#tagbar'), cnt = new Map();
  S.items.forEach(it => tagsOf(it).forEach(t => cnt.set(t, (cnt.get(t) || 0) + 1)));
  if(!cnt.size){ bar.classList.remove('on'); bar.innerHTML = ''; return; }
  const list = [...cnt.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ko'));
  bar.classList.add('on');
  bar.innerHTML = `<button class="tag${S.tag ? '' : ' sel'}" data-t="">전체<span class="n">${S.items.length}</span></button>` +
    list.map(([t, n]) => `<button class="tag${S.tag === t ? ' sel' : ''}" data-t="${esc(t)}">#${esc(t)}<span class="n">${n}</span></button>`).join('');
}
function drawMore(){
  if(S.drawn >= S.view.length){ if(!S.view.length) grid.innerHTML = emptyHTML(); return; }
  const frag = document.createDocumentFragment();
  const end = Math.min(S.drawn + CHUNK, S.view.length);
  for(let i = S.drawn; i < end; i++) frag.appendChild(card(S.view[i], i));
  grid.appendChild(frag);
  S.drawn = end;
  ioMore?.disconnect();
  if(S.drawn < S.view.length){
    const last = grid.children[Math.max(0, grid.children.length - 12)];
    ioMore = new IntersectionObserver(e => { if(e[0].isIntersecting) drawMore(); }, { rootMargin: '600px' });
    if(last) ioMore.observe(last);
  }
}
function emptyHTML(){
  const q = $('#q').value.trim();
  if(S.tag) return `<div class="empty"><div class="big">🏷️</div><p>#${esc(S.tag)} 에 해당하는 이미지가 없어요</p></div>`;
  if(q)     return `<div class="empty"><div class="big">🔍</div><p>“${esc(q)}” 검색 결과가 없어요</p></div>`;
  return `<div class="empty"><div class="big">🌸</div><p>아직 이미지가 없어요</p>
    <p class="hint">${S.admin ? '＋ 이미지 추가 로 채워보세요' : '아래 🔒 관리에서 로그인하면 추가할 수 있어요'}</p></div>`;
}
function card(it, idx){
  const d = document.createElement('div');
  d.className = 'card';
  d.dataset.i = idx;
  const tg = tagsOf(it);
  d.innerHTML =
    `<button class="thumb skel" aria-label="크게 보기"><img alt="" loading="lazy" decoding="async"></button>
     <div class="cap">
       <button class="nm"><span class="t">${esc(it.name)}</span><span class="ci">⧉</span></button>
       ${tg.length ? `<div class="tg">${tg.map(t => '#' + esc(t)).join(' ')}</div>` : ''}
     </div>`;
  const img = d.querySelector('img');
  io ||= new IntersectionObserver((es, ob) => {
    es.forEach(async e => {
      if(!e.isIntersecting) return;
      ob.unobserve(e.target);
      const el = e.target;
      const src = await srcOf(S.items.find(x => x.id === el.dataset.id) || {}, 'thumb');
      if(!src) return;
      el.onload  = () => { el.classList.add('ready'); el.parentElement.classList.remove('skel'); };
      el.onerror = () => el.parentElement.classList.remove('skel');
      el.src = src;
    });
  }, { rootMargin: '400px' });
  img.dataset.id = it.id;
  io.observe(img);
  return d;
}

function tagField(id, initial){
  return `<label class="f"><span>태그</span>
    <div class="taginput" id="${id}Wrap">
      <input id="${id}" placeholder="" autocomplete="off" enterkeyhint="done" data-init="${esc((initial || []).join(' '))}">
    </div>
    <span class="tip">띄어쓰기 또는 엔터를 누르면 <b>#태그</b>로 만들어집니다</span>
  </label>`;
}
function initTagField(id){
  const wrap = $('#' + id + 'Wrap'), input = $('#' + id);
  let tags = parseTags(input.dataset.init);
  const paint = () => {
    [...wrap.querySelectorAll('.chip')].forEach(c => c.remove());
    tags.forEach((t, i) => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.innerHTML = `#${esc(t)}<b data-i="${i}">✕</b>`;
      wrap.insertBefore(c, input);
    });
  };
  const commit = () => {
    const add = parseTags(input.value);
    if(add.length){ tags = parseTags(tags.concat(add).join(' ')); input.value = ''; paint(); }
  };
  input.addEventListener('keydown', e => {
    if(e.isComposing || e.keyCode === 229) return;   // 한글 조합 중이면 IME 에 맡긴다
    if(e.key === 'Enter' || e.key === ',' || e.key === ' '){ e.preventDefault(); commit(); }
    else if(e.key === 'Backspace' && !input.value && tags.length){ tags.pop(); paint(); }
  });
  input.addEventListener('input', e => { if(!e.isComposing && /[\s,]/.test(input.value)) commit(); });
  input.addEventListener('compositionend', () => { if(/[\s,]/.test(input.value)) commit(); });
  input.addEventListener('focus', () => wrap.classList.add('focus'));
  input.addEventListener('blur',  () => { wrap.classList.remove('focus'); commit(); });
  wrap.addEventListener('click', e => {
    const x = e.target.closest('b[data-i]');
    if(x){ tags.splice(+x.dataset.i, 1); paint(); } else input.focus();
  });
  paint();
  return { get(){ commit(); return tags.slice(); } };
}

function addSheet(){

  sheet(`

    </div>`);

  const tf = initTagField('fTags');
  const fi = $('#file'), dp = $('#drop');
  dp.onclick = () => fi.click();
  dp.ondragover = e => { e.preventDefault(); dp.classList.add('over'); };
  dp.ondragleave = () => dp.classList.remove('over');
  dp.ondrop = e => { e.preventDefault(); dp.classList.remove('over'); take(e.dataTransfer.files); };
  fi.onchange = () => take(fi.files);
  $('#cancel').onclick = closeSheet;

  // 이름 칸은 사진을 고르기 전에도 늘 보이게 하고, 다시 그릴 때 입력값을 지키지 않도록 보관해 둔다
  let nameVals = [];
  function snapshot(){
    document.querySelectorAll('#picks .nmi').forEach(el => nameVals[+el.dataset.i] = el.value);
  }
  function renderPicks(){
    const box = $('#picks');
    if(!picked.length){
      box.innerHTML = `<label class="f"><span>이름</span><input class="nmi" data-i="0" autocomplete="off"></label>`;
    }else if(picked.length === 1){
      box.innerHTML = `<div class="one">
        <img src="${previewURL(picked[0])}" alt="">
        <div class="fill"><label class="f"><span>이름</span><input class="nmi" data-i="0" autocomplete="off"></label></div>
      </div>`;
    }else{
      box.innerHTML = `<div class="rowhead">이름 (${picked.length}개)</div><div class="rows">` +
        picked.map((f, i) => `<div class="nrow"><img src="${previewURL(f)}" alt=""><input class="nmi" data-i="${i}" autocomplete="off"></div>`).join('') +
        `</div>`;
    }
    document.querySelectorAll('#picks .nmi').forEach(el => el.value = nameVals[+el.dataset.i] || '');
  }
  function take(fl){
    snapshot();
    picked = [...fl].filter(f => f.type.startsWith('image/'));
    dp.innerHTML = picked.length
      ? `<span class="ic">✅</span>${picked.length}장 선택됨 <span class="dim">· 다시 탭하면 변경</span>`
      : `<span class="ic">🌸</span>탭해서 사진 선택 <span class="dim">(여러 장 가능)</span>`;
    renderPicks();
    $('#save').disabled = !picked.length;
  }
  renderPicks();

  $('#save').onclick = async () => {
    const btn = $('#save'), n = picked.length;
    const names = [];
    document.querySelectorAll('#picks .nmi').forEach(el => names[+el.dataset.i] = el.value);
    btn.disabled = true; btn.textContent = '저장 중…';
    try{
      await addImages(picked, names, tf.get());
      closeSheet(); applyFilter(); toast(`${n}장 추가 완료`);
    }catch(err){
      btn.disabled = false; btn.textContent = '저장';
      toast('실패: ' + err.message, 4500);
    }
  };
}

/* ── 시작 ─────────────────────────────────────────────── */
function normalize(items){
  return (items || []).map(it => {
    if(!Array.isArray(it.tags)) it.tags = it.desc ? parseTags(it.desc) : [];
    delete it.desc;
    return it;
  });
}
(async function init(){
  try{ await boot(); }
  catch(err){ console.error(err); paintHead(); applyTheme(resolveTheme()); setAdminUI(); applyFilter(); toast('불러오는 중 문제가 발생했습니다', 4000); }
})();

async function boot(){
  try{ S.cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); }catch{}
  let remote = null;
  try{
    const r = await fetch('data.json?_=' + Date.now(), { cache: 'no-store' });
    if(r.ok) remote = await r.json();
  }catch{}

  if(remote && Array.isArray(remote.items)){
    S.mode  = 'github';
    S.items = normalize(remote.items);
    S.site  = { title: remote.title || DEF.title, sub: remote.sub ?? DEF.sub, theme: remote.theme || DEF.theme, cover: remote.cover || '' };
    S.admin = !!(S.cfg && S.cfg.token);
  }else{
    S.mode  = 'local';
    S.items = normalize(await getMeta('items'));
    S.site  = { ...DEF, ...((await getMeta('site')) || {}) };
    S.admin = true;                                  // 내 PC 파일로 열었을 때
  }
  paintHead(); applyTheme(resolveTheme()); setAdminUI(); applyFilter();

  // index.html 을 새로 올린 직후라면 링크 미리보기 주소를 한 번만 자동으로 채워 넣는다
  const og = document.querySelector('meta[property="og:url"]');
  if(S.admin && S.mode === 'github' && og && og.content.includes('__SITE__')){
    try{
      const ch = await ogChange();
      if(ch){ await commitAll([ch], 'set link preview'); toast('링크 미리보기를 설정했습니다', 3000); }
    }catch(e){ console.warn('og 자동설정 실패', e); }
  }
}
</script>
</body>
</html>
